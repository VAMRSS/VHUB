/* WSVF v0.2.0 / UI redesign based on the user's CONTEXT LENS v9.9.
   The UI retains the compact CONTEXT LENS style and uses the WSVF v0.10 contract. */
:root{
 --bone:#f6f6f6;--white:#fff;--black:#0a0a0a;--signal:#c81f3a;
 --signal-soft:rgba(200,31,58,.12);--mid:#6e6e6e;
 --bg:var(--bone);--surface:var(--white);--text:var(--black);
 --muted:#b2b2b2;--dim:var(--mid);--border:#e6e6e6;
 --shade:#f6f6f6;--accent:var(--signal);--accent-bg:var(--signal-soft);
 --danger:#c81f3a;--warning:#8b653f;
 --font-euro:"Eurostile","Helvetica Neue",Arial,"Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
 --font-body:"Helvetica Neue",Arial,"Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
 --font-mono:"BIZ UDPGothic","Noto Sans Mono CJK JP","Yu Gothic UI",monospace;
}
html,body{margin:0;min-height:100%;background:var(--bone);color:var(--black)}
body{font:400 12px/2 var(--font-body)}
button,input,select,textarea{font:inherit;border-radius:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:1px solid var(--black);outline-offset:-1px}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3,h4{font-weight:400}
.topbar{position:sticky;top:0;z-index:50;width:100%;min-height:64px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:14px;padding:0 20px;background:var(--white);border-bottom:.5px solid var(--border)}
.brand{display:flex;flex-direction:row;align-items:center;justify-self:start;gap:9px;min-width:0;width:auto;padding:0;border:0;background:transparent;color:var(--black);font:400 8px/1.2 var(--font-euro);letter-spacing:.04em;text-align:left;white-space:nowrap}
.signal-block{width:9px;height:9px;background:var(--signal);display:inline-block;flex:0 0 9px}
.header-center{font:400 8px/1.2 var(--font-euro);color:var(--muted);letter-spacing:.04em;white-space:nowrap;text-align:center}
.header-actions{justify-self:end;display:flex;align-items:center;gap:10px;white-space:nowrap}
.ghost-action{appearance:none;border:0;background:transparent;color:var(--black);padding:0;font:400 8px/1.2 var(--font-euro);letter-spacing:.04em}
.ghost-action:hover{color:var(--signal)}
.ghost-action:disabled{color:var(--muted);cursor:default}
.sep{color:var(--muted);font:400 8px/1.1 var(--font-euro)}
.app-version{font:400 8px/1.2 var(--font-euro);color:var(--muted);letter-spacing:.04em}
.migration-strip{width:100%;min-height:23px;display:flex;align-items:center;gap:12px;padding:2px 20px;background:var(--bone);border-bottom:.5px solid var(--border);font:400 9px/1.45 var(--font-body);color:var(--mid)}
.migration-strong{font:400 8px/1.2 var(--font-euro);letter-spacing:.04em;color:var(--signal)}
.migration-right{margin-left:auto;white-space:nowrap;font:400 8px/1.2 var(--font-euro);color:var(--muted)}
.main-container{width:100%;max-width:100%;min-height:calc(100vh - 141px);margin:0 auto;padding:0 20px 90px}
.width-fluid{max-width:100%}
.width-720{max-width:720px}.width-960{max-width:960px}.width-1200{max-width:1200px}.width-1440{max-width:1440px}
.menu-tabs{display:flex;align-items:center;gap:0;overflow-x:auto;min-height:42px;margin:8px 0;border-top:.5px solid var(--border);border-bottom:.5px solid var(--border);white-space:nowrap;background:var(--white);scrollbar-width:thin}
.menu-tabs .nav-btn{position:static;display:flex;align-items:center;justify-content:center;min-height:42px;flex:0 0 auto;padding:0 13px;color:var(--black);border:0;background:transparent;font:400 8px/1.1 var(--font-euro);letter-spacing:.04em;text-transform:uppercase}
.menu-tabs .nav-btn.active{color:var(--signal);font-weight:400}
.menu-tabs .nav-btn.active:after{display:none}
.menu-tabs .nav-btn:hover{color:var(--signal);background:#fafafa}
.footer{position:fixed;left:0;right:0;bottom:0;z-index:40;width:100%;min-height:52px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px;padding:0 20px;border-top:.5px solid var(--border);background:var(--bone);font:400 8px/1.2 var(--font-euro);letter-spacing:.04em;color:var(--black)}
.footer-status{justify-self:start;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.footer-note{display:block;justify-self:end;white-space:nowrap;font:400 8px/1.2 var(--font-euro);color:var(--muted)}
.width-opts{display:flex;align-items:center;gap:7px;justify-self:center}
.width-choice{min-width:0;padding:0;border:0;background:transparent;color:var(--muted);font:400 8px/1.2 var(--font-euro);letter-spacing:.04em}
.width-choice.active{border:0;background:none;color:var(--black)}
.width-choice:hover{color:var(--signal)}
.page-header{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:42px;margin:0;background:var(--bone);border-bottom:.5px solid var(--border);padding:4px 10px}
.page-header>div:first-child{display:flex;align-items:baseline;gap:12px;min-width:0;flex-wrap:wrap}
.page-header .eyebrow{display:none}
.page-header h1{margin:0;font:600 11px/1.6 var(--font-euro);letter-spacing:.03em;white-space:nowrap;color:var(--black)}
.page-header p{margin:0;color:var(--mid);font-size:10px;line-height:1.6}
.stat-line{gap:14px;color:var(--muted);font:400 8px/1.4 var(--font-euro);letter-spacing:.02em}
.stat-line b{font:400 12px/1.4 var(--font-euro);color:var(--black);margin-right:3px}
.project-layout{display:grid;grid-template-columns:minmax(240px,260px) minmax(0,1fr);gap:8px;align-items:start;margin-top:8px}
.project-sidebar,.project-detail,.surface,.list-panel,.reading-panel,.daily-block{background:var(--white);border:0;border-top:.5px solid var(--border);border-bottom:.5px solid var(--border);border-radius:0}
.project-sidebar{position:sticky;top:94px;max-height:calc(100vh - 158px);display:flex;flex-direction:column;overflow:hidden}
.side-head{padding:9px 10px 10px;border-bottom:.5px solid var(--border);background:var(--bone)}
.side-head .eyebrow{display:flex;justify-content:space-between;color:var(--black);font:400 8px/1.5 var(--font-euro);letter-spacing:.04em}
.side-head .num{color:var(--mid)}
.side-filters{display:grid;grid-template-columns:minmax(0,1fr) 95px;gap:8px;margin-top:8px}
.side-filters input,.side-filters select,input,select{min-height:30px;border:0;border-bottom:.5px solid var(--border);border-radius:0;background:transparent;color:var(--black);padding:4px 1px;outline:none;font-size:11px}
input::placeholder{color:var(--muted)}
.side-filters input:focus,.side-filters select:focus,input:focus,select:focus{border:0;border-bottom:1px solid var(--black)}
.side-filters select{font-size:9px}
.project-row{padding:9px 10px;gap:2px;border-bottom:.5px solid var(--border);text-align:left}
.project-row:last-child{border-bottom:0}
.project-row:hover{background:#fafafa}
.project-row.sel{padding-left:10px;background:var(--signal-soft);box-shadow:inset 3px 0 0 var(--signal);border-left:0;color:var(--black)}
.project-row.sel .project-id{color:var(--black)}
.project-id,.project-meta,.status-mini{font:400 8px/1.5 var(--font-euro);letter-spacing:.02em;color:var(--muted)}
.project-name{font-size:11px;line-height:1.55;color:var(--black)}
.project-meta{margin-top:2px}
.project-detail{min-width:0;overflow:hidden}
.detail-top{padding:8px 12px;border-bottom:.5px solid var(--border);background:var(--bone)}
.detail-top .eyebrow{font:400 8px/1.5 var(--font-euro);letter-spacing:.03em;color:var(--mid)}
.detail-top h1{font-size:13px;line-height:1.6;font-weight:600;margin:3px 0 4px}
.meta-line{gap:10px;font:400 8px/1.7 var(--font-euro);letter-spacing:.02em;color:var(--mid)}
.status{border:0;border-radius:0;background:transparent!important;color:var(--mid);font:400 9px/1.45 var(--font-body);padding:0}
.status.upcoming{color:#405d8b}.status.done{color:#168a52}.status.postponed{color:#926f3d}.status.cancelled{color:#a34b54}.status.wish{color:#756292}.status.check{color:#926f3d}
.status.neutral{color:var(--mid)}
.scope-layout{display:grid;grid-template-columns:minmax(180px,220px) minmax(0,1fr);align-items:stretch;min-height:610px}
.tree-block{position:sticky;top:94px;align-self:start;min-width:0;max-height:calc(100vh - 158px);overflow:auto;padding:0;border-bottom:0;border-right:.5px solid var(--border);background:var(--white)}
.tree-block .eyebrow{margin:0;min-height:38px;display:flex;align-items:center;justify-content:space-between;gap:7px;padding:0 9px;border-bottom:.5px solid var(--border);background:var(--bone);font:400 8px/1.2 var(--font-euro);letter-spacing:.03em;color:var(--black)}
.tree-scroll{max-height:none;display:flex;flex-direction:column;overflow:visible}
.tree-node{min-height:30px;display:flex;align-items:center;gap:5px;padding-top:4px;padding-bottom:4px;border-bottom:.5px solid #f0f0f0;line-height:1.5;color:var(--black);font-size:10px;white-space:normal}
.tree-node.selected{background:var(--signal-soft);box-shadow:inset 3px 0 0 var(--signal);color:var(--black)}
.tree-node:hover{background:#fafafa}
.tree-node-label{overflow:visible;text-overflow:clip;overflow-wrap:anywhere;min-width:0;flex:1}
.tree-node small{display:none}
.tree-branch{min-width:9px;color:var(--muted)}
.node-detail{min-width:0;padding:0 0 18px}
.node-label{font:400 8px/1.3 var(--font-euro);letter-spacing:.04em;color:var(--muted);padding:9px 12px 0}
.node-detail>h2{padding:0 12px;margin:4px 0 0;font-size:12px;font-weight:600;line-height:1.6}
.scope-path{padding:0 12px;margin:3px 0 0;font-size:10px;color:var(--mid);line-height:1.6}
.scope-id{padding:0 12px 9px;font:400 8px/1.5 var(--font-mono);color:var(--muted)}
.section-nav{display:flex;align-items:center;flex-wrap:nowrap;gap:0;overflow-x:auto;white-space:nowrap;border-top:.5px solid var(--border);border-bottom:.5px solid var(--border);padding:0 7px;background:var(--bone);scrollbar-width:thin}
.section-nav button,.sub-switch button{flex:0 0 auto;min-height:36px;padding:0 8px;border:0;border-radius:0;background:transparent;color:var(--mid);font:400 8px/1.15 var(--font-euro);letter-spacing:.03em}
.section-nav button.on,.sub-switch button.current{border:0;background:transparent;color:var(--signal)}
.section-nav button:hover,.sub-switch button:hover{color:var(--signal)}
.md-section{padding:0;border-bottom:.5px solid var(--border)}
.md-section:last-of-type{border-bottom:0}
.section-title{min-height:38px;display:flex;align-items:center;gap:10px;margin:0;padding:0 10px;border-bottom:.5px solid var(--border);background:var(--bone);color:var(--black);font:600 10px/1.2 var(--font-euro);letter-spacing:.04em}
.section-sub,.section-count{font:400 9px/1.5 var(--font-body);letter-spacing:0;color:var(--mid)}
.md-section>p,.md-section>.md-p{padding:6px 12px;margin:0;line-height:1.9;font-size:11px;overflow-wrap:anywhere}
.md-section>.md-list{margin:0;padding:9px 16px 12px 28px}
.md-list li{margin:2px 0;line-height:1.85;font-size:11px}
.md-head{margin:8px 0 0;padding:7px 12px;border-top:.5px solid var(--border);border-bottom:.5px solid var(--border);background:#fafafa;color:var(--black);font-weight:600;font-size:10px;line-height:1.55}
.md-code,.raw-text{margin:10px 12px;border:0;background:var(--white);padding:5px 0;white-space:pre-wrap;overflow-wrap:anywhere;font:400 12px/1.85 var(--font-body)}
.md-section .table-scroll{padding:0 0 6px}
.md-table,.schedule-table{font-size:11px}
.md-table th,.md-table td,.schedule-table th,.schedule-table td{padding:7px 9px;border-right:.5px solid var(--border);border-bottom:.5px solid var(--border);line-height:1.7;vertical-align:top}
.md-table th:last-child,.md-table td:last-child,.schedule-table th:last-child,.schedule-table td:last-child{border-right:0}
.md-table th,.schedule-table th{background:var(--bone);color:var(--mid);font:400 9px/1.5 var(--font-body);white-space:normal}
.schedule-table td{padding:8px 9px}
.schedule-table .date-cell{font:400 9px/1.6 var(--font-mono);white-space:nowrap}
.schedule-table .event-title{min-width:180px}
.event-id{font-size:8px;line-height:1.35;color:var(--muted)}
.inline-action{color:var(--black);font-size:11px}
.inline-action:hover{color:var(--signal)}
.project-jump span{font-size:10px}
.event-notes{color:var(--mid)}
.review-note{padding:6px 12px;font-size:9px;color:var(--mid);background:var(--white);border-bottom:.5px solid var(--border)}
.detail-actions{padding:12px;display:flex;gap:8px;flex-wrap:wrap}
.quiet-btn,.primary-btn{padding:4px 9px;border:.5px solid var(--border);border-radius:0;background:var(--white);font-size:9px;min-height:28px;color:var(--black);line-height:1.6}
.quiet-btn:hover{border-color:var(--signal);color:var(--signal)}
.primary-btn{background:var(--black);border-color:var(--black);color:var(--white)}
.primary-btn:hover{background:#333}
.filters{display:flex;flex-wrap:wrap;align-items:end;gap:7px 13px;margin:8px 0;border:0;border-top:.5px solid var(--border);border-bottom:.5px solid var(--border);padding:8px 10px;background:var(--bone)}
.filters label{flex:0 1 160px;min-width:110px;gap:2px;color:var(--mid);font:400 8px/1.2 var(--font-euro);letter-spacing:.02em}
.filters label.search-wide{flex:1 1 160px}
.filters input,.filters select{min-height:25px;font:400 10px/1.4 var(--font-body)}
.filters button{height:28px}
.surface{margin:8px 0;padding:0}
.surface>.table-scroll{max-height:none}
.surface>.eyebrow,.surface>h2,.surface>p{padding:6px 11px;margin:0}
.surface>.eyebrow{background:var(--bone);border-bottom:.5px solid var(--border);color:var(--mid);font:400 8px/1.4 var(--font-euro)}
.surface>h2{font-size:11px;font-weight:600;line-height:1.8}
.surface>p{font-size:11px;line-height:1.8}
.search-box{margin-top:8px;border:0;border-top:.5px solid var(--border);border-bottom:.5px solid var(--border);background:var(--bone);padding:8px 10px;gap:12px}
.search-box input{min-height:27px;padding:3px 2px;background:var(--white);font-size:12px;border:0;border-bottom:.5px solid var(--border)}
.search-box span{font:400 8px/1.4 var(--font-euro);color:var(--mid)}
.search-info{padding:8px 10px;margin:0;border-bottom:.5px solid var(--border);font-size:10px;background:var(--white);color:var(--mid)}
.results{display:block;gap:0;background:var(--white);border-bottom:.5px solid var(--border)}
.result-card{display:grid;grid-template-columns:104px minmax(0,1fr) minmax(170px,.7fr);grid-template-rows:auto auto;column-gap:0;row-gap:0;min-height:60px;align-items:center;width:100%;padding:0;border:0;border-bottom:.5px solid var(--border);border-radius:0;background:var(--white);text-align:left}
.result-card:last-child{border-bottom:0}
.result-card:hover{background:#fafafa}
.result-tag{grid-column:1;grid-row:1/3;align-self:stretch;display:flex;align-items:center;padding:8px 10px;border-right:.5px solid var(--border);font:400 9px/1.5 var(--font-euro);color:var(--mid)}
.result-title{grid-column:2;grid-row:1;align-self:end;padding:8px 10px 0;font-size:12px;font-weight:600;color:var(--black);line-height:1.55}
.result-path{grid-column:2;grid-row:2;align-self:start;padding:3px 10px 8px;font-size:9px;color:var(--mid);overflow-wrap:anywhere}
.result-summary{grid-column:3;grid-row:1/3;align-self:stretch;display:flex;align-items:center;padding:8px 10px;border-left:.5px solid var(--border);font-size:10px;line-height:1.6;color:var(--mid);overflow-wrap:anywhere}
.sub-switch{display:flex;align-items:center;gap:5px;background:var(--bone);border-bottom:.5px solid var(--border);margin:8px 0 0;padding:0 8px;overflow-x:auto}
.split-layout{display:grid;grid-template-columns:minmax(210px,300px) minmax(0,1fr);gap:8px;align-items:start;margin-top:8px}
.list-panel{max-height:calc(100vh - 175px);position:sticky;top:95px}
.list-panel>input{padding:10px;border-bottom:.5px solid var(--border);background:var(--bone)}
.list-entry{padding:8px 10px;border-bottom:.5px solid var(--border);gap:1px;font-size:11px;line-height:1.65}
.list-entry:hover{background:#fafafa}
.list-entry.sel{box-shadow:inset 3px 0 0 var(--signal);background:var(--signal-soft);color:var(--black)}
.list-entry .idline,.list-entry small{font-size:8px;color:var(--muted)}
.reading-panel{padding:0;min-height:350px}
.reading-panel>.eyebrow{padding:8px 12px;border-bottom:.5px solid var(--border);background:var(--bone);font:400 8px/1.4 var(--font-euro);color:var(--mid)}
.reading-panel>h2{padding:9px 12px 2px;margin:0;font-size:12px;font-weight:600;line-height:1.6}
.reading-panel>.mono.subtle,.reading-panel>p.mono.subtle{padding:2px 12px 8px;font-size:8px;margin:0;color:var(--mid)}
.reading-panel .raw-text{margin:5px 12px 18px;padding:0;line-height:1.85;font-size:12px}
.reading-panel .note-content{padding:9px 12px;margin:0}
.reading-panel .detail-actions{border-top:.5px solid var(--border)}
.reading-panel>.quiet-btn{margin:8px 12px 15px}
.daily-date{padding:8px 10px;margin:8px 0 0;gap:10px;border-top:.5px solid var(--border);border-bottom:.5px solid var(--border);background:var(--bone)}
.daily-date input{width:145px;min-height:27px}
.daily-date span{font-size:8px}
.daily-block{margin:0;padding:0;border-top:0;border-bottom:.5px solid var(--border)}
.daily-block h2{display:flex;align-items:center;gap:10px;padding:0 10px;min-height:36px;margin:0;border-bottom:.5px solid var(--border);background:var(--bone);color:var(--black);font:600 10px/1.2 var(--font-euro)}
.daily-block h2 small{font-size:9px;color:var(--mid)}
.daily-entry{padding:9px 12px;border-top:0;border-bottom:.5px solid var(--border)}
.daily-entry p{font-size:11px;line-height:1.8;color:var(--mid)}
.daily-entry .raw-text{border:0;background:transparent;padding:0;margin:6px 0;line-height:1.85;font-size:12px}
.data-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.data-card{min-height:205px;padding:0 10px 12px}
.data-card>.eyebrow{margin:0 -10px;padding:9px 10px;background:var(--bone);border-bottom:.5px solid var(--border)}
.data-card>h2{font-size:12px;margin:8px 0 3px}
.data-card>p{padding:0;line-height:1.8}
.upload-area{border:.5px dashed var(--border);background:#fafafa;color:var(--black);min-height:80px;margin-top:8px}
.upload-area:hover,.upload-area.dropping{border-color:var(--signal);background:#fcf7f8}
.upload-icon{font-size:19px}
.storage-counts{padding:10px;gap:8px}
.storage-counts b{font:400 19px/1.3 var(--font-euro);color:var(--black)}
.staged,.surface .versions-list{padding:0 10px 10px}
.version-row{border-bottom:.5px solid var(--border)}
.notice{margin:8px 0 0;padding:8px 36px 8px 10px;border-left:3px solid var(--signal);background:var(--white);color:var(--mid);font-size:10px}
.notice.error{background:#fafafa;color:var(--signal)}
.empty{padding:20px 10px;text-align:left;color:var(--mid);font-size:11px}
@media(max-width:1050px){
 .project-layout{grid-template-columns:minmax(190px,230px) minmax(0,1fr)}
 .scope-layout{grid-template-columns:190px minmax(0,1fr)}
 .result-card{grid-template-columns:90px minmax(0,1fr)}
 .result-summary{grid-column:2;grid-row:3;padding:0 10px 9px;border-left:0}
}
@media(max-width:900px){
 .topbar{grid-template-columns:minmax(0,1fr) auto;padding:0 14px}.header-center{display:none}
 .main-container{padding-left:14px;padding-right:14px}.migration-strip{padding-left:14px;padding-right:14px}
 .scope-layout{grid-template-columns:1fr}.tree-block{position:static;top:auto;max-height:210px;border-right:0;border-bottom:.5px solid var(--border)}
 .tree-scroll{max-height:172px;overflow:auto}.project-layout{grid-template-columns:minmax(170px,225px) minmax(0,1fr)}
 .footer{padding:0 14px}
}
@media(max-width:700px){
 .topbar{min-height:59px}.brand{font-size:8px}.header-actions{gap:7px}
 .main-container{padding:0 12px 86px}.migration-strip{padding:3px 12px;gap:8px}.migration-strip>span:nth-child(2){font-size:9px}.migration-right{display:none}
 .menu-tabs .nav-btn{padding:0 11px}
 .page-header{flex-wrap:wrap;gap:3px;padding:6px 8px}.page-header>div:first-child{gap:7px}
 .page-header p{flex-basis:100%;font-size:9px}.stat-line{gap:10px}
 .project-layout,.split-layout,.data-grid{grid-template-columns:1fr;gap:8px}
 .project-sidebar{position:static;top:auto;max-height:250px}.project-sidebar .side-scroll{max-height:174px}
 .project-detail{min-width:0}.tree-block{max-height:215px}
 .list-panel{position:static;top:auto;max-height:250px}.list-items{max-height:175px}
 .reading-panel{min-height:260px}
 .result-card{grid-template-columns:82px minmax(0,1fr)}
 .footer{grid-template-columns:1fr;justify-items:center;gap:0}.footer-status,.footer-note{display:none}.width-opts{justify-self:center}
 .schedule-table{min-width:660px}
 .storage-counts{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:390px){.brand{font-size:7px}.ghost-action,.app-version{font-size:7px}.project-row{padding:7px 9px}.detail-top{padding:8px 9px}.node-detail>h2{font-size:11px}}

/* v0.4.2 / common frame layout — existing data, import logic and storage IDs unchanged.
   F1: normal-flow header. F2 + F4: full-viewport sticky stack. F5: removed.
   F9: compact fixed footer. The width switch applies only to main content. */
:root{--wsvf-sticky-banner-h:26px;--wsvf-sticky-tabs-h:42px;--wsvf-sticky-total-h:68px;--wsvf-footer-h:26px}
.topbar{position:relative;top:auto;z-index:1}
.sticky-chrome{position:sticky;top:0;z-index:70;width:100%;background:var(--white)}
.sticky-chrome .migration-strip{width:100%;height:var(--wsvf-sticky-banner-h);min-height:var(--wsvf-sticky-banner-h);max-height:var(--wsvf-sticky-banner-h);padding:0 20px;display:flex;flex-wrap:nowrap;align-items:center;gap:10px;white-space:nowrap;overflow:hidden;line-height:1.3}
.sticky-chrome .migration-strong{flex:0 0 auto}
.sticky-chrome .migration-strip>span:nth-child(2){flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sticky-chrome .migration-right{flex:0 0 auto}
.sticky-chrome .menu-tabs{width:100%;height:var(--wsvf-sticky-tabs-h);min-height:var(--wsvf-sticky-tabs-h);margin:0;padding:0 7px;overflow-x:auto;overflow-y:hidden;border-top:0;border-bottom:.5px solid var(--border);background:var(--white)}
.sticky-chrome .menu-tabs .nav-btn{height:41px;min-height:41px}
.main-container{padding-top:8px;padding-bottom:calc(var(--wsvf-footer-h) + 26px);min-height:calc(100vh - 64px - var(--wsvf-sticky-total-h))}
.project-layout{margin-top:0}
.project-sidebar,.tree-block,.list-panel{top:calc(var(--wsvf-sticky-total-h) + 8px)}
.project-sidebar,.tree-block{max-height:calc(100dvh - var(--wsvf-sticky-total-h) - var(--wsvf-footer-h) - 16px)}
.list-panel{max-height:calc(100dvh - var(--wsvf-sticky-total-h) - var(--wsvf-footer-h) - 16px)}
.footer{height:var(--wsvf-footer-h);min-height:var(--wsvf-footer-h);padding:0 20px;gap:10px;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
.footer .width-choice{line-height:1;min-height:22px}
@media(max-width:900px){
 .sticky-chrome .migration-strip{padding:0 14px}
 .project-sidebar,.tree-block,.list-panel{top:calc(var(--wsvf-sticky-total-h) + 8px)}
}
@media(max-width:700px){
 .sticky-chrome .migration-strip{padding:0 12px;gap:7px;flex-wrap:nowrap}
 .sticky-chrome .migration-strip>span:nth-child(2){min-width:0;font-size:9px}
 .sticky-chrome .menu-tabs{padding:0 2px}
 .main-container{padding:8px 12px calc(var(--wsvf-footer-h) + 22px)}
 .footer{height:var(--wsvf-footer-h);min-height:var(--wsvf-footer-h);padding:0 10px;display:flex;align-items:center;justify-content:center;flex-wrap:nowrap}
 .footer .width-opts{margin:0 auto}
 .footer-status,.footer-note{display:none}
 .project-sidebar,.tree-block,.list-panel{position:static;max-height:250px}
}
@supports (top:env(safe-area-inset-top)){
 .sticky-chrome{top:env(safe-area-inset-top,0px)}
 .footer{padding-bottom:env(safe-area-inset-bottom,0px);height:calc(var(--wsvf-footer-h) + env(safe-area-inset-bottom,0px));min-height:calc(var(--wsvf-footer-h) + env(safe-area-inset-bottom,0px))}
}

/* v0.5 / drag and drop on every screen, always above chrome */
.global-drop-overlay{position:fixed;inset:0;z-index:1000;pointer-events:none;display:none;align-items:center;justify-content:center;background:rgba(246,246,246,.85);border:4px solid var(--signal)}
.global-drop-overlay.visible{display:flex}
.drop-message{padding:28px 32px;background:white;border:1px solid var(--signal);font-size:15px;line-height:1.7;text-align:center;max-width:min(92vw,560px)}
.drop-message span{display:block;margin-top:5px;color:var(--mid);font-size:10px;letter-spacing:.06em}
.data-current-row{display:grid;grid-template-columns:110px minmax(0,1fr) 75px auto;gap:8px;align-items:center;border-bottom:1px solid var(--border);padding:8px 10px;min-width:0;font-size:10px}
.data-current-row>div{min-width:0;overflow-wrap:anywhere}
.data-current-row .quiet-btn{font-size:9px;padding:3px 8px}
@media(max-width:650px){.data-current-row{grid-template-columns:80px minmax(0,1fr) auto}.data-current-row .revision-cell{display:none}.drop-message{padding:20px 14px;font-size:13px}}
/* v0.6 / LIBRARY explorer, editor, status bar */
.lib-explorer{display:grid;grid-template-columns:minmax(180px,240px) minmax(240px,340px) minmax(0,1fr);gap:8px;align-items:start;margin-top:8px}
.lib-pane{background:#fff;border-top:.5px solid var(--border);border-bottom:.5px solid var(--border);min-width:0}
.lib-pane-head{min-height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:var(--bone);border-bottom:.5px solid var(--border);font:400 8px/1.2 var(--font-euro);letter-spacing:.04em}
.lib-tree,.lib-list{max-height:calc(100dvh - 230px);overflow:auto}
.lib-folder{display:flex;align-items:center;gap:5px;width:100%;border:0;border-bottom:.5px solid #f0f0f0;background:#fff;text-align:left;padding:5px 8px;font-size:10px;color:var(--black);line-height:1.5}
.lib-folder:hover,.lib-row:hover{background:#fafafa}
.lib-folder.sel,.lib-row.sel{background:var(--signal-soft);box-shadow:inset 3px 0 0 var(--signal)}
.lib-folder small{margin-left:auto;color:var(--muted);font-size:8px}
.lib-row{display:grid;grid-template-columns:28px minmax(0,1fr);gap:6px;width:100%;border:0;border-bottom:.5px solid var(--border);background:#fff;text-align:left;padding:7px 10px;font-size:11px;line-height:1.5;color:var(--black)}
.lib-row small{display:block;font-size:9px;color:var(--mid);overflow-wrap:anywhere}
.lib-icon{font:400 8px/1.9 var(--font-euro);color:var(--muted)}
.lib-crumb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:5px 10px;font-size:10px;background:#fff;border-bottom:.5px solid var(--border)}
.lib-crumb button{border:0;background:transparent;padding:0;color:var(--black);font-size:10px}.lib-crumb button:hover{color:var(--signal)}
.lib-meta{width:calc(100% - 24px);margin:4px 12px 8px;border-collapse:collapse;font-size:10px}
.lib-meta th{width:110px;text-align:left;color:var(--mid);font-weight:400;background:var(--bone);padding:3px 8px;border-bottom:.5px solid var(--border);vertical-align:top}
.lib-meta td{padding:3px 8px;border-bottom:.5px solid var(--border);overflow-wrap:anywhere}
.lib-meta .inline-action{font-size:10px}
@media(max-width:1050px){.lib-explorer{grid-template-columns:200px minmax(0,1fr)}.lib-preview{grid-column:1/-1}}
@media(max-width:700px){.lib-explorer{grid-template-columns:1fr}.lib-tree,.lib-list{max-height:260px}}

/* v0.7 / PROJECT screen: status groups, bottom search, parent info, scroll-only child view */
.project-sidebar .side-scroll{flex:1 1 auto}
.status-group{border-bottom:.5px solid var(--border)}
.status-group-head{display:flex;align-items:center;gap:6px;width:100%;min-height:34px;padding:0 10px;border:0;background:var(--bone);color:var(--black);font:400 9px/1.2 var(--font-euro);letter-spacing:.04em;text-align:left}
.status-group-head:hover{color:var(--signal)}
.status-group-head .num{margin-left:auto;color:var(--mid)}
.status-group-head .caret{width:10px;color:var(--mid)}
.status-group-body .project-row:last-child{border-bottom:0}
.side-search{flex:0 0 auto;padding:8px 10px;border-top:.5px solid var(--border);background:var(--bone)}
.side-search input{width:100%}
.parent-link{border:0;background:transparent;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.parent-link:hover,.parent-link.on{color:var(--signal)}
.parent-overview{margin-top:4px;font-size:10px;line-height:1.7;color:var(--mid)}
.node-done{margin-left:auto;font-size:8px;color:var(--muted);white-space:nowrap}
.tree-node{padding-left:10px}
.node-detail .lib-meta{margin:8px 12px}
.node-detail .group-summary{margin-top:0;border-top:0}
/* v0.8 / fixed header (F1 inside sticky chrome), calendar, setting */
:root{--wsvf-header-h:44px;--wsvf-sticky-total-h:112px}
.sticky-chrome .topbar{position:static;height:var(--wsvf-header-h);min-height:var(--wsvf-header-h);border-bottom:.5px solid var(--border)}
.main-container{min-height:calc(100vh - var(--wsvf-sticky-total-h))}
@media(max-width:700px){.sticky-chrome .topbar{height:var(--wsvf-header-h);min-height:var(--wsvf-header-h)}}
.calendar{margin:8px 0;background:var(--white);border-top:.5px solid var(--border);border-bottom:.5px solid var(--border)}
.cal-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:6px 10px;background:var(--bone);border-bottom:.5px solid var(--border)}
.cal-modes,.cal-nav{display:flex;gap:2px}
.cal-modes button,.cal-nav button{border:.5px solid var(--border);background:var(--white);min-height:24px;padding:0 9px;font:400 9px/1 var(--font-euro);color:var(--black)}
.cal-modes button.on{background:var(--black);color:var(--white);border-color:var(--black)}
.cal-modes button:hover,.cal-nav button:hover{color:var(--signal)}
.cal-modes button.on:hover{color:var(--white)}
.cal-label{font:600 11px/1.4 var(--font-euro);letter-spacing:.03em}
.cal-legend{margin-left:auto;display:flex;gap:10px;font-size:9px;color:var(--mid)}
.cal-legend .lg:before{content:"";display:inline-block;width:9px;height:9px;margin-right:4px;vertical-align:-1px;border:.5px solid var(--border)}
.cal-legend .hol:before{background:#fbe3e6}.cal-legend .part:before{background:#fdf0dc}.cal-legend .off:before{background:#f1f1f1}.cal-legend .today:before{background:#fff;border:1.5px solid var(--signal)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-wd{padding:3px 6px;font:400 9px/1.4 var(--font-euro);color:var(--mid);background:var(--white);border-bottom:.5px solid var(--border);text-align:center}
.cal-wd.sun{color:#c0392b}.cal-wd.sat{color:#2c5fa8}
.cal-cell{min-height:86px;min-width:0;padding:2px 3px 4px;border-right:.5px solid var(--border);border-bottom:.5px solid var(--border);background:var(--white);display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cal-cell:nth-child(7n+7){border-right:0}
.cal-cell.off{background:#f6f6f6}.cal-cell.hol{background:#fdf1f2}.cal-cell.part{box-shadow:inset 0 -3px 0 #f3c58a}
.cal-cell.other{opacity:.45}
.cal-cell.today{box-shadow:inset 0 0 0 1.5px var(--signal)}
.cal-cell.today.part{box-shadow:inset 0 0 0 1.5px var(--signal),inset 0 -4px 0 #f3c58a}
.cal-date{align-self:flex-start;border:0;background:transparent;padding:0 2px;font:400 10px/1.5 var(--font-euro);color:var(--black)}
.cal-date:hover{color:var(--signal);text-decoration:underline}
.cal-cell.sun .cal-date,.cal-cell.hol .cal-date{color:#c0392b}.cal-cell.sat:not(.hol) .cal-date{color:#2c5fa8}
.cal-cell.today .cal-date{font-weight:700;color:var(--signal)}
.cal-hol{font-size:9px;line-height:1.35;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-hol.full{color:#b02a3a}.cal-hol.partial{background:#fdf0dc;color:#8a5a12}
.cal-ev{display:block;width:100%;text-align:left;border:0;border-left:2px solid currentColor;background:#f7f7f7;padding:0 3px;font:400 9.5px/1.45 var(--font-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--black)}
.cal-ev:hover{background:var(--signal-soft)}
.cal-ev.upcoming{border-left-color:#405d8b}.cal-ev.done{border-left-color:#168a52;color:#5a5a5a}.cal-ev.postponed{border-left-color:#926f3d}.cal-ev.cancelled{border-left-color:#a34b54;text-decoration:line-through;color:#888}.cal-ev.wish{border-left-color:#756292}.cal-ev.check{border-left-color:#926f3d}
.cal-time{font:400 8.5px/1 var(--font-mono);color:var(--mid);margin-right:3px}
.cal-more{border:0;background:transparent;padding:0 3px;font-size:9px;color:var(--mid);text-align:left}
.cal-more:hover{color:var(--signal)}
.cal-3m{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
.cal-mini{border-right:.5px solid var(--border)}.cal-mini:last-child{border-right:0}
.cal-mini-title{padding:5px 8px;font:600 10px/1.4 var(--font-euro);border-bottom:.5px solid var(--border)}
.cal-cell.mini{min-height:34px;align-items:center;justify-content:flex-start;padding:3px;border-bottom:.5px solid #f0f0f0;font:400 10px/1.3 var(--font-euro);cursor:pointer;color:var(--black)}
.cal-cell.mini:hover{background:var(--signal-soft)}
.cal-cell.mini.sun span,.cal-cell.mini.hol span{color:#c0392b}.cal-cell.mini.sat:not(.hol) span{color:#2c5fa8}
.cal-dot{font-style:normal;margin-top:2px;min-width:14px;padding:0 3px;border-radius:7px;background:var(--black);color:#fff;font-size:8px;line-height:13px;text-align:center}
@media(max-width:900px){.cal-3m{grid-template-columns:1fr}.cal-mini{border-right:0;border-bottom:.5px solid var(--border)}.cal-legend{margin-left:0}}
@media(max-width:700px){.cal-cell{min-height:64px}.cal-ev{font-size:8.5px}}
.setting-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-top:8px}
.st-card{padding:0 0 10px}
.st-card>.eyebrow{padding:8px 11px;background:var(--bone);border-bottom:.5px solid var(--border);color:var(--mid);font:400 8px/1.4 var(--font-euro);margin:0}
.st-card>h2{padding:8px 11px 0;margin:0;font-size:12px;font-weight:600}
.st-card>p{padding:4px 11px 6px;margin:0;font-size:10px;color:var(--mid);line-height:1.8}
.st-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:6px 11px;border-top:.5px solid var(--border)}
.st-row select{width:auto;min-width:120px}
.st-label{font:400 9px/1.4 var(--font-euro);color:var(--mid);min-width:110px}
.st-check{display:inline-flex;align-items:center;gap:3px;font-size:11px}
.st-check input{width:auto;min-height:0;margin:0}
.hol-form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 12px;padding:8px 11px;border-top:.5px solid var(--border);background:#fcfcfc}
.hol-form>.eyebrow{grid-column:1/-1;font:400 8px/1.4 var(--font-euro);color:var(--signal)}
.hol-form label{display:flex;flex-direction:column;gap:2px;font:400 8px/1.3 var(--font-euro);color:var(--mid)}
.hol-form label.wide{grid-column:span 2}
.hol-form input,.hol-form select{min-height:26px;font:400 11px/1.4 var(--font-body)}
.hol-form input:disabled{opacity:.35}
.hol-form .actions{grid-column:1/-1;margin:0}
.hol-table td.nowrap{white-space:nowrap}
.hol-table tr.editing td{background:var(--signal-soft)}
.hol-type{font-size:10px;padding:0 4px}.hol-type.full{color:#b02a3a}.hol-type.partial{background:#fdf0dc;color:#8a5a12}
.st-io{padding:8px 11px 0;margin:0;align-items:center}
@media(max-width:700px){.hol-form{grid-template-columns:1fr 1fr}.hol-form label.wide{grid-column:1/-1}}

/* v0.9 / LIBRARY drawer, lib links, references, day list, fix actions */
.lib-link{display:inline;border:0;background:var(--signal-soft);color:var(--black);padding:0 4px;font:inherit;font-family:var(--font-mono);font-size:.95em;cursor:pointer;border-bottom:1px solid var(--signal)}
.lib-link:hover{background:var(--signal);color:#fff}
.lib-link.missing{background:#f2f2f2;border-bottom:1px dashed var(--muted);color:var(--mid)}
.drawer-mask{position:fixed;inset:0;z-index:900;background:rgba(10,10,10,.18)}
.lib-drawer{position:fixed;top:0;right:0;bottom:0;z-index:910;width:min(600px,94vw);background:#fff;border-left:.5px solid var(--border);box-shadow:-8px 0 24px rgba(0,0,0,.12);display:flex;flex-direction:column;animation:drawerIn .18s ease-out}
@keyframes drawerIn{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.drawer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:.5px solid var(--border);background:var(--bone)}
.drawer-head .eyebrow{font:400 8px/1.4 var(--font-euro);color:var(--mid)}
.drawer-head h2{margin:3px 0 0;font-size:13px;font-weight:600;line-height:1.5}
.drawer-x{border:0;background:transparent;font-size:20px;line-height:1;color:var(--mid);padding:2px 6px}
.drawer-x:hover{color:var(--signal)}
.drawer-body{flex:1;overflow:auto;padding:4px 0 10px}
.drawer-body .lib-meta{margin:8px 12px}
.drawer-body .note-content{padding:4px 12px}
.drawer-foot{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-top:.5px solid var(--border);background:var(--bone)}
body.drawer-open{overflow:hidden}
.lib-refs{margin:8px 12px;border-top:.5px solid var(--border)}
.lib-refs-head{padding:6px 0;font:400 8px/1.4 var(--font-euro);color:var(--mid);letter-spacing:.04em}
.lib-ref-row{display:grid;grid-template-columns:78px minmax(0,1fr);gap:8px;width:100%;text-align:left;border:0;border-bottom:.5px solid var(--border);background:#fff;padding:6px 4px;font-size:11px;color:var(--black)}
.lib-ref-row:hover{background:var(--signal-soft)}
.lib-ref-row .mono{font-size:9px;color:var(--mid)}
.lib-ref-row small{display:block;font-size:9px;color:var(--mid)}
.cal-cell.picked{outline:2px solid var(--black);outline-offset:-2px}
.cal-daylist{margin:0 0 8px;background:#fff;border-bottom:.5px solid var(--border)}
.cal-daylist-head{display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--bone);border-bottom:.5px solid var(--border);font-size:11px}
.cal-daylist-head .quiet-btn{margin-left:auto}
.cal-daylist-hol{padding:6px 10px;font-size:11px;border-bottom:.5px solid var(--border)}
.fix-actions{display:flex;gap:6px;margin-top:6px}
.notice .fix-actions button{position:static;font-size:10px;color:inherit}
.notice .fix-actions .primary-btn{color:#fff}
.side-search{display:flex;flex-direction:column;gap:6px}
.side-new{width:100%}
.project-detail{overflow:clip}
/* v0.10 / NEW PROJECT page, reset */
.np-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,320px);gap:8px;margin-top:8px;align-items:start}
.np-card{padding:0 0 12px}
.np-card>.eyebrow{padding:8px 11px;background:var(--bone);border-bottom:.5px solid var(--border);color:var(--mid);font:400 8px/1.4 var(--font-euro);margin:0}

.np-ids .quiet-btn{margin-left:auto}
.np-field{display:flex;flex-direction:column;gap:3px;padding:8px 11px 0;font:400 8px/1.4 var(--font-euro);color:var(--mid)}

.np-text{width:100%;min-height:calc(100dvh - 430px);min-height:300px;resize:vertical;padding:10px 12px;border:.5px solid var(--border);background:#fff;font:400 12px/1.8 var(--font-body);color:var(--black)}
.np-text:focus{outline:1px solid var(--black)}
.np-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding:8px 11px 0}
.np-card .actions{padding:8px 11px 0;margin:0}
.np-help ol{margin:8px 11px 0 28px;padding:0;font-size:11px;line-height:1.9}

.danger-btn{padding:4px 11px;min-height:28px;border:.5px solid var(--signal);background:#fff;color:var(--signal);font-size:9px}

.tb-row{display:block;width:100%;text-align:left;border:0;border-bottom:.5px solid var(--border);background:#fff;padding:7px 10px;font-size:11px;line-height:1.5;color:var(--black)}
.tb-row small{display:block;font-size:8px;color:var(--muted)}

function request(req){return new Promise((resolve,reject)=>{req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
async function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{let db=r.result;if(!db.objectStoreNames.contains('docs'))db.createObjectStore('docs',{keyPath:'key'});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.onblocked=()=>reject(Error('別タブのデータベース接続によりブロックされています'));});}
function localData(){let s=localStorage.getItem(LOCAL_KEY);return s?JSON.parse(s):{documents:[]};}
/* Only latest documents remain; old version store is cleared once during initialization. */
async function discardStoredVersions(){
 if(storageMode==='local'){
  const data=localData();if('versions' in data)localStorage.setItem(LOCAL_KEY,JSON.stringify({documents:data.documents||[]}));
  return;
 }
 if(!database.objectStoreNames.contains('versions'))return;
 await new Promise((resolve,reject)=>{const tx=database.transaction(['versions'],'readwrite');tx.objectStore('versions').clear();tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||Error('旧保存世代の削除に失敗'));tx.onerror=()=>reject(tx.error);});
}
function txCommit(docRecords,expectedHeads=null){
 if(storageMode==='local'){
  const data=localData(),d=new Map(data.documents.map(x=>[x.key,x]));
  if(expectedHeads)for(const r of docRecords){const actual=d.get(r.key),exp=expectedHeads.get(r.key);if((actual?.hash||null)!==(exp?.hash||null)||(actual?.revision||null)!==(exp?.revision||null))throw Error('保存直前のrevision競合');}
  for(const r of docRecords)d.set(r.key,r);
  // localStorage.setItem is atomic for one key, so a failed write preserves previous data.
  localStorage.setItem(LOCAL_KEY,JSON.stringify({documents:[...d.values()]}));
  return Promise.resolve();
 }
 return new Promise((resolve,reject)=>{
  const tx=database.transaction(['docs'],'readwrite');
  tx.oncomplete=()=>resolve();
  tx.onerror=()=>reject(tx.error||Error('保存トランザクション失敗'));
  tx.onabort=()=>reject(tx.error||Error('保存トランザクション中止'));
  const docs=tx.objectStore('docs');
  if(expectedHeads){
   for(const r of docRecords){const req=docs.get(r.key);req.onsuccess=()=>{
    const actual=req.result,exp=expectedHeads.get(r.key);
    if((actual?.hash||null)!==(exp?.hash||null)||(actual?.revision||null)!==(exp?.revision||null)){tx.abort();return;}
    docs.put(r);
   };}
  }else for(const r of docRecords)docs.put(r);
 });
}

function renderMarkdown(s){
 if(!s?.trim())return '<p class="muted">記録なし</p>';let lines=s.split('\n'),out=[],fence=null,list=false;
 const endList=()=>{if(list){out.push('</ul>');list=false;}};
 for(let i=0;i<lines.length;i++){
  let line=lines[i],f=fenceInfo(line);
  if(fence){if(f&&f[1][0]===fence[0]&&f[1].length>=fence[1]&&!f[2].trim()){out.push('</code></pre>');fence=null;}else out.push(esc(line)+'\n');continue;}
  if(f){endList();fence=[f[1][0],f[1].length];out.push('<pre class="md-code"><code>');continue;}
  if(line.startsWith('|')){
   endList();let j=i,t=[];while(j<lines.length&&lines[j].startsWith('|')){t.push(lines[j]);j++;}i=j-1;
   let rows=t.map(x=>x.replace(/^\|/,'').replace(/\|\s*$/,'').split(/(?<!\\)\|/).map(y=>y.trim().replace(/\\\|/g,'|'))).filter(x=>x.some(y=>y.trim())&&!x.every(y=>/^:?-+:?$/.test(y)));

  }

function precheck(p,existing){let errors=[...p.errors],warnings=[...p.warnings];let old=existing.find(x=>x.key===p.key)||null;
 if(p.kind==='project'&&old&&old.id!==p.meta.project_id)return {parsed:p,name:p.name,key:p.key,hash:p.hash||sha256(p.text),old:null,action:'error',errors:['project_uid が既存の '+old.id+' と同じです。別の案件には新しいUUIDが必要です（新規PROJECT指示書から作り直してください）'],warnings};let hash=p.hash||sha256(p.text);p.hash=hash;let action='new';
 if(old){const nr=p.kind==='library'?libRev(p.meta):+p.meta.revision,or=+old.revision;
  if(old.kind!==p.kind)errors.push('既存キーの種類が異なります');
  else if(nr<or){action='skip';errors.length=0;var skipNote='保存済み rev.'+or+' の方が新しいためスキップ';}
  else if(nr===or&&hash!==old.hash)errors.push('同一revision（rev.'+or+'）で内容が異なります。revisionを+1してください');
  else if(nr===or)action='skip';
  else action='update';}
 if(p.kind==='project'&&old){const oldP=parseStored(old);if(oldP.meta?.project_id!==p.meta.project_id)errors.push('project_id変更は不可');if(oldP.meta?.last_event_seq!==undefined&&+p.meta.last_event_seq<+oldP.meta.last_event_seq)errors.push('last_event_seqの巻き戻し不可');if(oldP.meta?.last_recall_seq!==undefined&&+p.meta.last_recall_seq<+oldP.meta.last_recall_seq)errors.push('last_recall_seqの巻き戻し不可');}
 const fr=fileRev(p.name),nr2=revOf(p);if(fr!==null&&fr!==nr2)warnings.push(p.name+'：ファイル名の_r'+fr+'と中身のrevision '+nr2+'が一致しません（中身のrevisionで判定）');
 return {parsed:p,name:p.name,key:p.key,hash,old,action,errors:action==='skip'?[]:errors,warnings,note:typeof skipNote!=='undefined'?skipNote:''};}
function globalValidate(staged){
 const seenStaged=new Map();for(const s of staged){if(!s.key||s.action==='skip')continue;if(seenStaged.has(s.key)){s.errors.push('同一バッチ内で同一データIDが重複');seenStaged.get(s.key).errors.push('同一バッチ内で同一データIDが重複');}else seenStaged.set(s.key,s);}
 const changed=staged.filter(s=>s.parsed&&s.action!=='skip');const combined=new Map(state.docs.map(x=>[x.key,x]));for(const s of changed)combined.set(s.key,toRecord(s.parsed));
 const parsed=[...combined.values()].map(parseStored);const idMap=new Map(),uidMap=new Map(),nodeMap=new Map(),evtMap=new Map(),recMap=new Map(),libMap=new Map();
 function register(map,id,owner,msg){if(!id)return; if(map.has(id)){for(const s of staged.filter(s=>s.key===owner||s.key===map.get(id)))s.errors.push(msg+': '+id);}else map.set(id,owner);}
 for(const p of parsed){const owner=p.key;if(p.kind==='project'){register(idMap,p.meta.project_id,owner,'PROJECT表示IDが重複');register(uidMap,p.meta.project_uid,owner,'PROJECT UUIDが重複');for(const n of p.nodes){if(!n.root)register(nodeMap,n.id,owner,'内部ノードIDが重複');for(const e of n.events)register(evtMap,e.id,owner,'予定IDが重複');for(const r of n.recalls)register(recMap,r.id,owner,'RECALL IDが重複');}}
 if(p.kind==='library')register(libMap,p.meta.id,owner,'LIBRARY IDが重複');}
 // Cross-references are checked without silently fabricating absent items from the draft.
 const knownEvents=new Set(evtMap.keys()),knownLib=new Set(libMap.keys());
 for(const s of staged){const p=s.parsed;if(!p||s.action==='skip')continue;
 if(p.kind==='project')for(const n of p.nodes){for(const e of n.events){if(e.related&&!knownEvents.has(e.related)&&!String(e.related).toLowerCase().includes(String(p.meta.project_uid).toLowerCase()))s.warnings.push('参照先の関連予定が未取込: '+e.related);}
 const rows=mdTableRows(n.sections.LIBRARY||'');for(const row of rows){if(/^LIB-\d+$/.test(row[0])&&!knownLib.has(row[0]))s.warnings.push('LIBRARY資料未収録: '+row[0]);}
 }
 // Refuse accidental omission of active history records across project/notes revisions.
 if(s.old&&p.kind==='project'){
   const previous=parseStored(s.old);const oldEvents=previous.nodes.flatMap(n=>n.events.map(e=>e.id));const oldRecalls=previous.nodes.flatMap(n=>n.recalls.map(r=>r.id));
   
   for(const id of oldRecalls)if(!recMap.has(id))s.errors.push('旧版からRECALL IDが消失: '+id);
   const presentNodeIds=new Set(parsed.filter(x=>x.kind==='project').flatMap(x=>x.nodes.slice(1).map(n=>n.id)));
    for(const n of previous.nodes.slice(1))if(!presentNodeIds.has(n.id))s.errors.push('旧版から内部ノードが消失: '+n.id);
 }
 }
}
async function stageFilesCore(files,mode='auto',opts={}){
 if(!files?.length)return false;
 if(state.busy){severity('前の取込処理中です。','error');return false;}
 if(!state.storageOK){severity('保存領域が利用できないためMDを取り込めません。','error');return false;}
 state.busy=true;
 try{
  const latest=await loadDocs();state.docs=latest;derived();
  const staged=[];
  for(const f of files){const name=f.name||'';
   try{if(!/\.md$/i.test(name))throw Error('Markdown（.md）以外は取り込めません');
    const text=await f.text();
    if(isLibraryIndex(text)){staged.push({name,key:'',errors:[],warnings:['library-index.mdは廃止されました（不要のためスキップ）'],action:'skip'});continue;}
    const p=parseIncoming(text,name);staged.push(precheck(p,latest));
   }catch(e){staged.push({name,key:'',errors:[String(e.message||e)],warnings:[],action:'error'});}
  }
  const byKey=new Map();for(const s of staged){if(!s.parsed||!s.key)continue;if(!byKey.has(s.key))byKey.set(s.key,[]);byKey.get(s.key).push(s);}
  for(const arr of byKey.values()){if(arr.length<2)continue;const max=Math.max(...arr.map(s=>revOf(s.parsed)));const tops=arr.filter(s=>revOf(s.parsed)===max);
   if(new Set(tops.map(s=>s.hash)).size>1){tops.forEach(s=>s.errors.push('同じrevision（rev.'+max+'）で内容の異なるファイルが同時に渡されました'));continue;}
   const keep=tops.find(s=>s.action!=='skip')||tops[0];for(const s of arr){if(s===keep)continue;s.errors=[];s.action='skip';s.note=revOf(s.parsed)<max?'同時に渡された rev.'+max+' を採用':'同じ内容の重複';}}
  globalValidate(staged);
  const failures=staged.filter(s=>s.errors?.length);
  if(failures.length){
   const detail=failures.map(s=>`${s.name}: ${s.errors.join(' ／ ')}`).join(' ｜ ');{const fx=failures.filter(f=>f.parsed?.kind!=='toolbox'&&f.parsed?.kind!=='holidays'&&!f.errors.some(e=>/指示書・相談パック|NOTESは|LIBRARY|ツールMD/.test(e)));state.lastFix=fx.length?buildFixRequest(fx):'';}
   severity((opts.dryRun?'検証エラー（未保存）：':'取込を中止（保存データは変更なし）：')+cut(detail,700),'error');return false;
  }
  state.lastFix='';const warnText=staged.flatMap(s=>s.warnings||[]);const warnTail=warnText.length?' ／ 注意：'+cut(warnText.join(' ・ '),400):'';
  if(opts.dryRun){severity('検証に合格しました（まだ保存していません）。'+warnTail,'success');return true;}
  const applying=staged.filter(s=>s.action!=='skip');
  const skipText=staged.filter(s=>s.action==='skip'&&s.parsed).map(s=>s.name+'（rev.'+revOf(s.parsed)+'：'+(s.note||'登録済みの最新版と同一')+'）');const skipTail=skipText.length?' ／ スキップ：'+cut(skipText.join('、'),400):'';
  if(!applying.length){severity('取り込む変更はありません。APPには既に最新版があります。'+skipTail+warnTail,'success');return true;}
  // Check against the latest committed version before the transaction; commit itself checks the same heads atomically.
  const fresh=await loadDocs();
  const rechecked=applying.map(s=>precheck(s.parsed,fresh));
  const original=state.docs;state.docs=fresh;globalValidate(rechecked);state.docs=original;
  if(rechecked.some(s=>s.errors.length||s.action==='skip'))throw Error('保存直前に変更・競合がありました。再度MDをドロップしてください');
  const records=applying.map(s=>toRecord(s.parsed));
  await txCommit(records,new Map(applying.map(s=>[s.key,s.old])));
  state.docs=await loadDocs();derived();
  const selected=records.filter(r=>r.kind==='library');if(selected.length===1){state.selectedLibrary=selected[0].id;state.libFolder='';}
  severity(records.length+'件のMDを保存しました（新規 '+staged.filter(s=>s.action==='new').length+'件／更新 '+staged.filter(s=>s.action==='update').length+'件）。採用：'+cut(applying.map(s=>s.name+'（rev.'+revOf(s.parsed)+'）').join('、'),300)+(selected.length===1?' LIBRARY ID: '+selected[0].id:'')+skipTail+warnTail,'success');
  return true;
 }catch(e){severity('取込失敗（既存MDは維持）：'+String(e.message||e),'error');return false;}
 finally{state.busy=false;}
}

const CRC_TABLE=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();

function makeZip(files){

 const dosTime=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dosDate=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();

  const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,dosTime,true);lh.setUint16(12,dosDate,true);lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
  parts.push(new Uint8Array(lh.buffer),name,data);
  const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,dosTime,true);ch.setUint16(14,dosDate,true);ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,name.length,true);ch.setUint32(42,offset,true);
  central.push(new Uint8Array(ch.buffer),name);offset+=30+name.length+data.length;}

/* ===== v0.8.0 — versioned file names, latest-only import, SCHEDULE calendar, SETTING (holidays) ===== */
const HOL_TYPES=['祝日','休日','午前休','午後休','時間休'],HOL_FULL=['祝日','休日'],WD=['日','月','火','水','木','金','土'];
function revOf(p){return p.kind==='library'?libRev(p.meta):+p.meta.revision;}
function stemOf(name){return String(name||'').split(/[\\/]/).pop().replace(/\.md$/i,'').replace(/_r\d+$/i,'');}
function exportName(r){const base=r.kind==='toolbox'?'WSVF_TOOLBOX':r.kind==='project'||r.kind==='tool'?r.id:r.kind==='holidays'?'WSVF_HOLIDAYS':(stemOf(r.name)||r.id);return `${base}_r${r.revision}.md`;}
function fileRev(name){const m=String(name||'').match(/_r(\d+)\.md$/i);return m?+m[1]:null;}
/* ---- holidays MD ---- */
function holTableRows(body){const out=[];let head=null;for(const line of outsideLines(body)){if(!line||!line.trim().startsWith('|'))continue;if(/^\s*\|[\s|:-]+\|?\s*$/.test(line))continue;const cells=line.trim().replace(/^\|/,'').replace(/\|\s*$/,'').split('|').map(x=>x.trim());if(!head){head=cells;continue;}const o={};head.forEach((h,i)=>o[h]=cells[i]??'');out.push(o);}return out;}
function timeOk(v){return /^([01]\d|2[0-3]):[0-5]\d$/.test(v);}
function parseHolidays(text,name){
 const {meta,body}=parseFront(text),errors=[],warnings=[];
 if(meta.calendar_id!=='WSVF-HOLIDAYS')errors.push('calendar_idはWSVF-HOLIDAYSが必要');
 if(!/^\d+$/.test(String(meta.revision||''))||+meta.revision<1)errors.push('revisionは正の整数が必要');
 if(meta.updated_at&&!/^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d+)?(?:Z|[+-]\d\d:\d\d)$/.test(meta.updated_at))errors.push('updated_atの形式が不正');
 const wo=listOf(meta.weekly_off).map(x=>String(x).trim()).filter(Boolean);for(const w of wo)if(!WD.includes(w))errors.push('weekly_offの曜日が不正: '+w);
 const items=[];
 holTableRows(body).forEach((r,i)=>{const it={date:r.date||'',end_date:(r.end_date||'').replace(/^—$/,''),type:r.type||'',name:(r.name||'').replace(/^—$/,''),start_time:(r.start_time||'').replace(/^—$/,''),end_time:(r.end_time||'').replace(/^—$/,''),note:(r.note||'').replace(/^—$/,'')};
  const at=(i+1)+'行目 ';
  if(!dateOk(it.date))errors.push(at+'dateが不正: '+it.date);
  if(it.end_date&&(!dateOk(it.end_date)||it.end_date<it.date))errors.push(at+'end_dateが不正: '+it.end_date);
  if(!HOL_TYPES.includes(it.type))errors.push(at+'typeは'+HOL_TYPES.join(' / ')+'のいずれか: '+it.type);
  if(it.type==='時間休'){if(!timeOk(it.start_time)||!timeOk(it.end_time)||it.end_time<=it.start_time)errors.push(at+'時間休はstart_time・end_time（HH:MM、終了＞開始）が必要');}
  else if(it.start_time||it.end_time){if((it.start_time&&!timeOk(it.start_time))||(it.end_time&&!timeOk(it.end_time)))errors.push(at+'時刻の形式が不正');}
  items.push(it);});
 items.sort((a,b)=>cmp(a.date,b.date)||cmp(a.start_time,b.start_time));
 return {kind:'holidays',meta:{...meta,weekly_off:wo},items,errors,warnings,key:'h:WSVF-HOLIDAYS',name,text};
}
function buildHolidaysText(items,weeklyOff,revision){
 const cell=v=>String(v??'').replace(/\|/g,'／').replace(/[\r\n]+/g,' ').trim();
 const rows=[...items].sort((a,b)=>cmp(a.date,b.date)||cmp(a.start_time,b.start_time)).map(it=>`| ${it.date} | ${cell(it.end_date)} | ${it.type} | ${cell(it.name)} | ${cell(it.start_time)} | ${cell(it.end_time)} | ${cell(it.note)} |`);
 return `---\nschema: "wsvf.holidays.v1"\ncalendar_id: "WSVF-HOLIDAYS"\nrevision: ${revision}\nupdated_at: "${isoNow()}"\ntimezone: "Asia/Tokyo"\nweekly_off: [${weeklyOff.join(', ')}]\n---\n\n# WSVF HOLIDAYS\n\n| date | end_date | type | name | start_time | end_time | note |\n| --- | --- | --- | --- | --- | --- | --- |\n${rows.join('\n')}${rows.length?'\n':''}`;
}
async function saveHolidays(items,weeklyOff){
 const latest=await loadDocs();const rec=latest.find(x=>x.key==='h:WSVF-HOLIDAYS')||null;
 const text=buildHolidaysText(items,weeklyOff,(+rec?.revision||0)+1);const p=parseHolidays(text,'WSVF_HOLIDAYS.md');
 if(p.errors.length){severity('保存できません：'+p.errors.join(' ／ '),'error');return false;}
 p.hash=sha256(text);const r=toRecord(p);r.name=exportName(r);
 try{await txCommit([r],new Map([[r.key,rec]]));}catch(e){severity('保存に失敗：'+String(e.message||e),'error');return false;}
 state.docs=await loadDocs();derived();return true;
}
function holidayIndex(){const map=new Map();for(const it of state.holidaysDoc?.items||[]){let d=it.date;const end=it.end_date||it.date;let guard=0;while(d<=end&&guard++<400){if(!map.has(d))map.set(d,[]);map.get(d).push(it);d=addDays(d,1);}}return map;}

/* ---- date helpers (YYYY-MM-DD strings, UTC math) ---- */
function toD(s){const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d));}
function ymd(d){return d.toISOString().slice(0,10);}
function addDays(s,n){const d=toD(s);d.setUTCDate(d.getUTCDate()+n);return ymd(d);}
function dow(s){return toD(s).getUTCDay();}
function weekStartOf(s){const ws=state.weekStart;return addDays(s,-((dow(s)-ws+7)%7));}

function calDays(){const a=calAnchor(),m=state.calMode;let s,n;if(m==='month'){s=weekStartOf(monthStart(a));const e=addMonths(a,1);n=0;let d=s;while(d<e||dow(d)!==state.weekStart){n++;d=addDays(d,1);}return Array.from({length:n},(_,i)=>addDays(s,i));}s=weekStartOf(a);n=m==='2w'?14:42;return Array.from({length:n},(_,i)=>addDays(s,i));}

function bumpFront(text){const m=text.match(/^---\r?\n([\s\S]*?)\r?\n---/);if(!m)throw Error('front matterがありません');const nl=m[0].includes('\r\n')?'\r\n':'\n';let fm=m[1];
 const rm=fm.match(/^revision:\s*"?(\d+)"?\s*$/m);if(!rm)throw Error('revisionが見つかりません');const nr=+rm[1]+1;
 fm=fm.replace(/^revision:.*$/m,()=>'revision: '+nr);
 fm=/^updated_at:.*$/m.test(fm)?fm.replace(/^updated_at:.*$/m,()=>'updated_at: "'+isoNow()+'"'):fm+nl+'updated_at: "'+isoNow()+'"';
 return {text:'---'+nl+fm+nl+'---'+text.slice(m[0].length),rev:nr};}
function removeEventRow(text,id){const lines=text.split('\n');const re=new RegExp('^\\s*\\|\\s*'+id.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*\\|');const hit=lines.map((l,i)=>re.test(l)?i:-1).filter(i=>i>=0);
 if(hit.length!==1)throw Error(hit.length?'同じ予定IDの行が複数あります':'予定の行が見つかりません');lines.splice(hit[0],1);return lines.join('\n');}

APPで次の予定を削除しました。現在の最新版は ${p.meta.project_id}_r${rev}.md（revision ${rev}）です。
- ${e.id}｜${e.start}${e.end?' ～ '+e.end:''} ${e.title}（${e.status}・${n.id} ${n.name}）
以後、この予定は記録に含めないでください（IDは再利用しない）。次にMDを書き出す時は revision ${rev+1}（${p.meta.project_id}_r${rev+1}.md）とし、この削除を反映した内容にしてください。返答は「了解」だけで構いません。`;}
async function deleteEvent(ctx){const [pid,nid,eid]=ctx.split('|');const p=state.projects.find(x=>x.meta.project_id===pid);const n=p?.nodes.find(x=>x.id===nid);const e=n?.events.find(x=>x.id===eid);
 if(!e){severity('予定が見つかりません。画面を更新してください。','error');return;}
 const d=e.start.slice(0,10),noHist=e.status==='実施'&&!n.history.some(h=>h.date===d);
 const msg=`次の予定を ${pid} の原本MDから削除します。\n\n${e.start}${e.end?' ～ '+e.end:''}　${e.title}（${e.status}）\n${n.name}\n\n${noHist?`⚠ HISTORYに ${d} の記録がないようです。削除すると、この実施の記録が残らない可能性があります。\n\n`:''}revisionが ${p.meta.revision} → ${+p.meta.revision+1} に上がります。よろしいですか？`;
 if(!confirm(msg))return;
 let out;try{out=bumpFront(removeEventRow(p.text,eid));}catch(err){severity('削除できません：'+String(err.message||err),'error');return;}
 const ok=await stageFiles([{name:`${pid}_r${out.rev}.md`,text:async()=>out.text}]);
 if(!ok)return;

 severity(`予定「${e.title}」を削除しました（${pid} rev.${out.rev}）。このPROJECTを相談中のAIチャットがある場合は、連絡文を貼り付けて最新版に合わせてください。`,'success',{sync:note});}

/* ===== v0.32.0 — TOOLBOX is one MD (WSVF_TOOLBOX_r<rev>.md). APP only reads it; AI adds/updates tools. ===== */
const TBX_KEY='x:WSVF-TOOLBOX';
const TBX_ID_RE=/^[A-Z][A-Z0-9]*-\d{2,}$/;
const TBX_GUIDE=`## AI GUIDE｜TOOLBOX MDの編集ルール（このMDを受け取ったAIは最初に読むこと）
- このファイルはWSVF APPのTOOLBOX（AIへの指示文のひな形集）です。APPに取り込むと、ここに書かれたツールだけがTOOLBOXに表示されます。
- ユーザーから「ツールを追加・変更・削除して」と頼まれた時だけ編集し、**このファイルの全文**を1つのコードブロック（6個以上のバッククォート）で出力してください。省略は禁止です。
- 内容を変えたら front matter の revision を +1 し、updated_at を現在日時にしてください。ファイル名は WSVF_TOOLBOX_r<revision>.md と案内してください。
- この「AI GUIDE」節と、front matter のキー名は変えないでください。
- ツール1件の書式（見出しの形・項目名・本文のコードブロックを守る）：
  - 見出し：\`## TOOL <ツールID>｜<ツール名>\`。ツールIDは英大文字と数字＋「-」＋2桁以上の番号（例：STD-03、TOOL-105）。既存のIDは変えない。新しいツールは TOOL- の最大番号+1。
  - 見出しの直後に \`- category: <分類>\` と \`- description: <どんな時に使うか（1行）>\`。
  - 標準ツール（STD-）は description の次に \`- std_version: <版>\` の行を持つ。APPが内蔵の標準ツールと比べて更新を知らせるために使うので、変更・削除しない（標準ツールを最新版に置き換える時だけ、その版に合わせる）。
  - その下に、指示文の本文を1つのコードブロック（\`\`\`\`\`text で始め \`\`\`\`\` で閉じる。本文中に5個以上のバッククォートがある場合は、それより長いフェンスにする）。
- 本文には次の変数を使えます。コピー時にAPPが値を入れます（ここにない変数は使わない）：
{{VARS}}
- 変数 project_ で始まるもの・next_ で始まるもの・children を使うツールは、APPで対象PROJECTを選んでから使います。
- ツールの並び順がTOOLBOXの表示順です。不要なツールは見出しから本文の終わりまでを削除します。
`;
function tbxVarList(){return TOOL_VARS.map(([k,d])=>`  - \`{{${k}}}\`：${d}`).join('\n');}
function tbxFence(body){let max=4;for(const m of String(body).matchAll(/`{3,}/g))max=Math.max(max,m[0].length);return '`'.repeat(max+1);}
function buildToolboxText(tools,rev){const now=isoNow();
 const items=tools.map(t=>tbxSection(t)).join('\n');
 return `---\nschema: "wsvf.toolbox.v1"\ntoolbox_id: "WSVF-TOOLBOX"\nrevision: ${rev}\nupdated_at: "${now}"\n---\n\n# WSVF TOOLBOX\n\n${TBX_GUIDE.replace('{{VARS}}',tbxVarList())}\n${items}`;}
function parseToolbox(text,name){const {meta,body}=parseFront(text),errors=[],warnings=[],tools=[];
 if(meta.toolbox_id!=='WSVF-TOOLBOX')errors.push('toolbox_idはWSVF-TOOLBOXが必要');
 if(!/^\d+$/.test(String(meta.revision||''))||+meta.revision<1)errors.push('revisionは正の整数が必要');
 const lines=body.split(/\r?\n/);let cur=null,fence=null,buf=[];const ids=new Set();
 const close=()=>{if(cur){if(cur.body===null)errors.push(cur.id+' 本文のコードブロックがありません');tools.push(cur);}cur=null;};
 for(let i=0;i<lines.length;i++){const l=lines[i];
  if(fence){if(new RegExp('^\\s*'+fence[0]+'{'+fence.length+',}\\s*$').test(l)&&l.trim().length>=fence.length&&l.trim()[0]===fence[0]){cur.body=buf.join('\n');buf=[];fence=null;}else buf.push(l);continue;}
  const h=l.match(/^## TOOL (\S+)｜(.+)$/);
  if(h){close();cur={id:h[1],title:h[2].trim(),cat:'未分類',desc:'',body:null};if(!TBX_ID_RE.test(cur.id))errors.push('ツールIDの形式が不正: '+cur.id);if(ids.has(cur.id))errors.push('ツールIDが重複: '+cur.id);ids.add(cur.id);continue;}
  if(/^## /.test(l)){close();continue;}
  if(!cur)continue;
  const m=l.match(/^- (category|description|std_version):\s*(.*)$/);if(m&&cur.body===null){if(m[1]==='category')cur.cat=m[2].trim()||'未分類';else if(m[1]==='std_version')cur.stdv=m[2].trim();else cur.desc=m[2].trim();continue;}
  const f=l.match(/^\s*(`{3,}|~{3,})\s*\w*\s*$/);if(f&&cur.body===null){fence=f[1];buf=[];continue;}
 }
 if(fence)errors.push((cur?.id||'')+' コードブロックが閉じられていません');
 close();
 if(!tools.length)errors.push('ツールが1件もありません（「## TOOL <ID>｜<名前>」の見出しが必要）');
 const known=new Set(TOOL_VARS.map(v=>v[0]));
 for(const t of tools){if(!t.body||!t.body.trim())errors.push(t.id+' 本文が空です');const unk=[...new Set([...String(t.body||'').matchAll(/\{\{([a-z_]+)\}\}/g)].map(m=>m[1]).filter(k=>!known.has(k)))];if(unk.length)warnings.push(t.id+' 未対応の変数：'+unk.map(k=>'{{'+k+'}}').join('、'));}
 return {kind:'toolbox',meta,tools,errors,warnings,key:TBX_KEY,name,text};}
function legacyTools(){return state.parsed.filter(x=>x.kind==='tool'&&!x.errors.length).map(p=>({id:p.meta.tool_id,cat:p.meta.category,title:p.meta.title,desc:p.meta.description||'',body:p.body}));}
function toolboxDoc(){return state.parsed.find(x=>x.kind==='toolbox'&&!x.errors.length)||null;}
function allTools(){const d=toolboxDoc();if(d)return d.tools.map(t=>({...t,std:false,rev:+d.meta.revision}));return [...STD_TOOLS.map(t=>({...t,std:true,rev:1})),...legacyTools().map(t=>({...t,std:false,rev:1}))];}
function currentToolboxText(){const d=toolboxDoc();if(d)return {text:d.text,rev:+d.meta.revision,fromDoc:true};return {text:buildToolboxText(allTools(),1),rev:1,fromDoc:false};}

${c.text.replace(/\s*$/,'\n')}${f}

function evtReadForm(){const v=id=>($(id)?.value||'').trim();const f=state.evtForm;return {nid:f.eid?f.nid:v('ef-nid'),sd:v('ef-sd'),st:v('ef-st'),ed:v('ef-ed'),et:v('ef-et'),title:v('ef-title'),status:v('ef-status'),related:v('ef-related'),note:v('ef-note')};}
function replaceEventRow(text,id,row){const lines=text.split('\n');const re=new RegExp('^\\s*\\|\\s*'+id.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*\\|');const hit=lines.map((l,i)=>re.test(l)?i:-1).filter(i=>i>=0);
 if(hit.length!==1)throw Error(hit.length?'同じ予定IDの行が複数あります':'予定の行が見つかりません');const cr=lines[hit[0]].endsWith('\r')?'\r':'';lines[hit[0]]=row+cr;return lines.join('\n');}
function insertEventRow(text,nid,row){const lines=text.split('\n'),L=i=>lines[i].replace(/\r$/,'');let fence=null,hi=-1;
 for(let i=0;i<lines.length;i++){const f=fenceInfo(L(i));if(fence){if(f&&f[1][0]===fence[0]&&f[1].length>=fence[1]&&!f[2].trim())fence=null;continue;}if(f){fence=[f[1][0],f[1].length];continue;}if(L(i).startsWith('### SUBPROJECT '+nid+'｜')){hi=i;break;}}
 if(hi<0)throw Error('SUBPROJECT '+nid+' が見つかりません');
 let si=-1;for(let i=hi+1;i<lines.length;i++){if(/^#{1,3} /.test(L(i)))break;if(/^#### SCHEDULE｜/.test(L(i))){si=i;break;}}
 if(si<0)throw Error(nid+' のSCHEDULE節が見つかりません');
 let last=-1;for(let i=si+1;i<lines.length;i++){if(/^#{1,4} /.test(L(i)))break;if(/^\s*\|/.test(L(i)))last=i;}
 if(last<0)throw Error(nid+' のSCHEDULE表が見つかりません');
 const cr=lines[last].endsWith('\r')?'\r':'';lines.splice(last+1,0,row+cr);return lines.join('\n');}
function setFrontKey(text,key,val){const m=text.match(/^---\r?\n([\s\S]*?)\r?\n---/);if(!m)throw Error('front matterがありません');const re=new RegExp('^'+key+':.*$','m');if(!re.test(m[1]))throw Error(key+'が見つかりません');const fm=m[1].replace(re,()=>key+': '+val);return text.slice(0,m.index)+m[0].replace(m[1],()=>fm)+text.slice(m.index+m[0].length);}
function evtDesc(e){return `${e.start}${e.end?' ～ '+e.end:''} ${e.title}（${e.status}${e.related?'・関連 '+e.related:''}${e.note&&e.note!=='—'?'・備考 '+e.note:''}）`;}
function evtSyncNote(p,kind,id,n,before,after,rev,seq){return `【WSVF ${p.meta.project_id} 更新の連絡】
APPで次の予定を${kind==='add'?'追加':'変更'}しました。現在の最新版は ${p.meta.project_id}_r${rev}.md（revision ${rev}）です。
- 対象：${id}（${n.id} ${n.name}）
${kind==='add'?`- 追加：${evtDesc(after)}\n- last_event_seq は ${seq} になりました（次に新しい予定を作る時は ${seq+1} から）。`:`- 変更前：${evtDesc(before)}\n- 変更後：${evtDesc(after)}`}
以後はこの内容を記録として扱ってください。次にMDを書き出す時は revision ${rev+1}（${p.meta.project_id}_r${rev+1}.md）とし、この${kind==='add'?'追加':'変更'}を反映した内容にしてください。返答は「了解」だけで構いません。`;}
async function evtSave(){const f=state.evtForm;if(!f)return;const p=state.projects.find(x=>x.meta.project_id===f.pid);if(!p){severity('PROJECTが見つかりません。','error');return;}
 const v=evtReadForm();Object.assign(f,v);const n=p.nodes.find(x=>x.id===v.nid&&!x.root);
 const err=[];if(!n)err.push('登録先のSUBPROJECTを選んでください');
 if(!dateOk(v.sd))err.push('開始日を入力してください');
 if(v.et&&!v.ed)err.push('終了時刻だけは指定できません（終了日も入力）');
 if(v.ed&&!dateOk(v.ed))err.push('終了日が不正です');
 const start=v.sd+(v.st?' '+v.st:''),end=v.ed?v.ed+(v.et?' '+v.et:''):'';
 if(end){const both=v.st&&v.et;if(both?end<start:v.ed<v.sd)err.push('終了は開始以降にしてください');}
 if(!v.title)err.push('内容を入力してください');
 if(!STATUSES.includes(v.status))err.push('状態が不正です');
 if(v.related&&!eventFormat.test(v.related))err.push('関連予定IDの形式が不正です');
 if(err.length){severity('保存できません：'+err.join(' ／ '),'error');return;}
 const after={start,end,title:evtCell(v.title),status:v.status,related:v.related,note:evtCell(v.note)};
 let text=p.text,id=f.eid,seq=null,before=null;
 try{
  if(f.eid){const e=n.events.find(x=>x.id===f.eid);if(!e)throw Error('予定が見つかりません');before={start:e.start,end:e.end,title:e.title,status:e.status,related:e.related,note:e.note};
   const same=before.start===after.start&&(before.end||'')===after.end&&before.title===after.title&&before.status===after.status&&(before.related||'')===after.related&&((before.note==='—'?'':before.note)||'')===after.note;
   if(same){state.evtForm=null;severity('変更はありません（MDは書き換えていません）。','info');return;}
   text=replaceEventRow(text,id,`| ${id} | ${start} | ${end||'—'} | ${after.title} | ${after.status} | ${after.related||'—'} | ${after.note||'—'} |`);}
  else{seq=+p.meta.last_event_seq+1;id=`EVT-${p.meta.project_uid}-${String(seq).padStart(6,'0')}`;
   if(state.events.some(e=>e.id===id))throw Error('採番した予定IDが既に使われています：'+id);
   text=insertEventRow(text,n.id,`| ${id} | ${start} | ${end||'—'} | ${after.title} | ${after.status} | ${after.related||'—'} | ${after.note||'—'} |`);text=setFrontKey(text,'last_event_seq',seq);}
 }catch(e2){severity('保存できません：'+String(e2.message||e2),'error');return;}
 const out=bumpFront(text);
 const ok=await stageFiles([{name:`${p.meta.project_id}_r${out.rev}.md`,text:async()=>out.text}]);
 if(!ok)return;
 state.evtForm=null;const kind=f.eid?'edit':'add';const note=evtSyncNote(p,kind,id,n,before,after,out.rev,seq);state.syncNote=note;
 severity(`予定「${after.title}」を${kind==='add'?'追加':'変更'}しました（${p.meta.project_id} rev.${out.rev}・${n.id}）。このPROJECTを相談中のAIチャットがある場合は、連絡文を貼り付けて最新版に合わせてください。`,'success',{sync:note});}
async function v34Click(b){const d=b.dataset;
 if(d.evtAdd){const [pid,nid]=d.evtAdd.split('|');evtOpen(pid,nid||'','');return true;}
 if(d.evtEdit){const [pid,nid,eid]=d.evtEdit.split('|');evtOpen(pid,nid,eid);return true;}
 if(d.evtClose!==undefined){state.evtForm=null;render();return true;}
 if(d.evtSave!==undefined){await evtSave();return true;}
 return false;}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.evtForm){state.evtForm=null;render();}});
document.addEventListener('click',e=>{if(state.evtForm&&e.target.matches&&e.target.matches('.drawer-mask[data-evt-close]')){state.evtForm=null;render();}});

init();
</script>

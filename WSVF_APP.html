/* WSVF v0.2.0 / UI redesign based on the user's CONTEXT LENS v9.9.
   The UI retains the compact CONTEXT LENS style and uses the WSVF v0.10 contract. */
:root{
 --bone:#f6f6f6;--white:#fff;--black:#0a0a0a;--signal:#c81f3a;
 --signal-soft:rgba(200,31,58,.12);--mid:#6e6e6e;
 --bg:var(--bone);--surface:var(--white);--text:var(--black);
 --muted:#b2b2b2;--dim:var(--mid);--border:#e6e6e6;
 --shade:#f6f6f6;--accent:var(--signal);--accent-bg:var(--signal-soft);
 --danger:#c81f3a;--warning:#8b653f;

 --font-body:"Helvetica Neue",Arial,"Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
 --font-mono:"BIZ UDPGothic","Noto Sans Mono CJK JP","Yu Gothic UI",monospace;
}

body{font:400 12px/2 var(--font-body)}
button,input,select,textarea{font:inherit;border-radius:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:1px solid var(--black);outline-offset:-1px}
button{cursor:pointer}
a{color:inherit}

.cal-bar{justify-content:flex-end}
/* v0.39 / SC0-a English labels, week jump buttons */

.status-group-head .grp-tg{margin-left:6px;font:400 8px/15px var(--font-en);color:var(--mid)}

.rail-head{height:15px;min-height:15px;padding:0 10px;font:400 8px/15px var(--font-en)}
.rail-x{height:15px;padding:0 2px;font:400 8px/15px var(--font-en)}
.rail-toggle{font:400 8px/1 var(--font-en)}.rail-toggle span{font-family:var(--font-en);font-size:8px}
.section-title{height:15px;min-height:15px;padding:0 10px;font:400 8px/15px var(--font-en)}

.section-title .section-count{font-size:8px;line-height:15px}
.section-title .ask-btn{font-size:8px;line-height:11px;padding:0 5px}
.cal-wd{height:15px;line-height:15px;padding:0 6px;font:400 8px/15px var(--font-en);letter-spacing:.06em}
.cal-bar{padding:4px 10px}
.cal-modes button,.cal-nav button{height:15px;min-height:15px;padding:0 6px;font:400 8px/13px var(--font-en)}

/* v0.41 / open-close marks: plain + / - placed before the title */
.status-group-head .grp-tg{margin:0 6px 0 0;width:8px;flex:0 0 8px;text-align:center}
.lib-folder .tree-branch{width:10px;flex:0 0 10px;text-align:center}
.rail-head{justify-content:flex-start;gap:6px}.rail-head .rail-x{order:-1}
details>summary::before{content:"+ "}details[open]>summary::before{content:"- "}
/* v0.43 / F2 removed, TOOLBOX list: controls at bottom, LIBRARY sort, ZIP password dialog */
.tb-list{display:flex;flex-direction:column}
.tb-scroll{flex:1 1 auto;min-height:0;overflow:auto}

.zip-drawer{width:min(460px,94vw)}

.zip-note{margin:0;padding:0 12px 10px;font-size:10px;line-height:1.7;color:var(--mid)}

.tk-pid{font:400 9px/1.6 var(--font-euro);color:var(--mid);margin-right:8px}

.tk-text{font:400 11px/1.75 var(--font-ja);overflow-wrap:anywhere}

.tk-note{font:400 10px/1.8 var(--font-ja);color:var(--mid);margin:10px 0 0}

.tk-title{font:400 12px/1.6 var(--font-ja);color:var(--black)}

.tk-prow-in{display:flex;align-items:center;gap:8px}
.tk-prow-r{margin-left:auto;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tk-reqcnt{font:400 9px/1.6 var(--font-ja);color:var(--lc-fg-a34b54)}

.tk-reqinfo.up{color:var(--lc-fg-405d8b)}.tk-reqtag.up{background:var(--lc-bg-eef2f8);color:var(--lc-fg-405d8b)}
.tk-ops{width:auto!important;min-width:150px!important}
.tk-ops button{margin-left:4px}
.tk-up-btn{color:var(--lc-fg-405d8b)!important}
.tk-quick{display:flex;gap:6px;align-items:center}
.tk-resolve{display:flex;flex-direction:column;gap:3px;font:400 11px/1.7 var(--font-ja)}

.tk-chk input{width:auto!important;min-height:0!important;margin-top:4px}
.tk-drawer .tk-quick,.tk-drawer .tk-resolve,.tk-drawer .hol-form>label.full{grid-column:1/-1}.tk-chk .tk-kind{flex:0 0 auto;white-space:nowrap}

html[data-theme="dark"]{color-scheme:dark;
 --bone:#121413;--white:#1a1c1b;--black:#e4e7e5;--signal:#e8506a;--signal-soft:rgba(232,80,106,.17);--mid:#9ea4a1;
 --muted:#6c7270;--border:#2f3231;--shade:#121413;--danger:#e8506a;--warning:#c9a06b;
 --bg:var(--bone);--surface:var(--white);--text:var(--black);--dim:var(--mid);--accent:var(--signal);--accent-bg:var(--signal-soft)}

/* v0.48.0 / THEME: LIGHT（従来の表示）/ DARK。切替はF9-eとST2-a。色だけを変え、UIの構成・寸法は変えない */
html[data-theme="dark"],html[data-theme="dark"] body{background:var(--bone);color:var(--black)}
html[data-theme="dark"] .brand-logo{filter:invert(1) hue-rotate(180deg)}
html[data-theme="dark"] .primary-btn:hover{background:#c9cccb;border-color:#c9cccb}
html[data-theme="dark"] .notice .fix-actions .primary-btn,html[data-theme="dark"] .notice.toast .fix-actions .primary-btn,html[data-theme="dark"] .cal-dot{color:var(--white)}
html[data-theme="dark"] .cal-modes button.on:hover{color:var(--white)}
html[data-theme="dark"] ::selection{background:rgba(232,80,106,.35);color:#fff}
html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea{color:var(--black)}
html[data-theme="dark"] select option{background:var(--white);color:var(--black)}
html[data-theme="dark"] ::-webkit-calendar-picker-indicator{filter:invert(.85)}
.footer-right{justify-self:end;display:flex;align-items:center;gap:12px;white-space:nowrap;min-width:0}
.theme-opts{display:flex;align-items:center;gap:7px}
@media(max-width:700px){.footer-right{margin-left:12px}}
/* v0.49.0 / DARK: accent = yellow, rules (borders・lines) darker than the surrounding background */
html[data-theme="dark"]{--signal:#e8c547;--signal-soft:rgba(232,197,71,.14);--accent:var(--signal);--accent-bg:var(--signal-soft);
 --border:#070808;--lc-bd-b4d1c0:#070808;--lc-bd-c1d1c5:#070808;--lc-bd-c4d9ca:#070808;--lc-bd-c5d7c9:#070808;--lc-bd-d4e3d9:#070808;--lc-bd-e1e5e1:#070808;--lc-bd-e5eae6:#070808;--lc-bd-e6e6e6:#070808;--lc-bd-e6ece7:#070808;--lc-bd-e7e5da:#070808;--lc-bd-edf0ec:#070808;--lc-bd-edf1ec:#070808;--lc-bd-eef0ed:#070808;--lc-bd-f0f0f0:#070808;--lc-fg-c81f3a:#e8c547;--lc-bd-c81f3a:#e8c547;--lc-bg-fdecee:rgba(232,197,71,.14)}
html[data-theme="dark"] .lib-link:hover,html[data-theme="dark"] .danger-btn:hover,html[data-theme="dark"] .evt-del:hover{color:#121413}
html[data-theme="dark"] ::selection{background:rgba(232,197,71,.35);color:#fff}
html[data-theme="dark"] .side-search,html[data-theme="dark"] .ai-rail{box-shadow:none}
/* v0.50.0 / SCROLLBAR (Chrome / Edge): 6px・矢印なし・角は四角・通り道は透明。テーマ別の色。
   scrollbar-width / scrollbar-color を指定すると ::-webkit-scrollbar が無効になるため、F4・P2-f は auto に戻す（.topnav の none は維持） */
:root{--sb-thumb:#d5dad6;--sb-thumb-hover:#87918b}
html[data-theme="dark"]{--sb-thumb:#2c2f2e;--sb-thumb-hover:#e8c547}
.menu-tabs,.section-nav{scrollbar-width:auto}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:var(--sb-thumb);border-radius:0}
::-webkit-scrollbar-thumb:hover,::-webkit-scrollbar-thumb:active{background:var(--sb-thumb-hover)}
::-webkit-scrollbar-button{display:none;width:0;height:0}

/* v0.51.0 / SCHEDULE: 予定の追加（SC0-i）・申請チップ（SC0-j）・追加申請一覧（SC3）・追加フォーム（SC4） */
.cal-bar .cal-add{margin-right:auto;height:15px;min-height:15px;padding:0 8px;border:.5px solid var(--border);background:var(--white);font:400 9px/13px var(--font-ja);color:var(--black);cursor:pointer}
.cal-bar .cal-add:hover{color:var(--signal)}
.cal-ev.sch-pend{border-left:2px dashed var(--signal);background:var(--signal-soft);color:var(--mid)}
.cal-ev.sch-pend:hover{color:var(--black)}
.sch-tag{display:inline-block;margin-right:3px;padding:0 2px;border:.5px solid currentColor;font:400 7.5px/1.3 var(--font-ja);vertical-align:1px}
.cal-daylist-head .sch-add-day{margin-left:auto}
.cal-daylist-head .sch-add-day+.quiet-btn{margin-left:0}
.cal-daylist-sch{padding:6px 10px;font-size:11px;border-bottom:.5px solid var(--border)}
.cal-daylist-sch .sch-tag{color:var(--signal)}
.sch-surface{margin:0 0 var(--gut)}
.sch-surface .num{color:var(--signal)}
.sch-table td{vertical-align:top}
.sch-table tr.focus td{background:var(--signal-soft)}
.sch-table .sch-ops{white-space:nowrap;text-align:right}
.sch-table .sch-ops button{margin-left:4px}
.sch-main{margin:0 0 6px}
.sch-main .sch-main-head{padding:4px 10px;font-size:10px;color:var(--mid);background:var(--bone);border-bottom:.5px solid var(--border)}
.sch-drawer .hol-form>label.full{grid-column:1/-1}
.sch-drawer textarea{min-height:56px;font:400 11px/1.5 var(--font-body)}
/* v0.51.0 / DARK: 休日等の表記を黄色に */
html[data-theme="dark"] .cal-cell.off,html[data-theme="dark"] .cal-cell.hol{background:rgba(232,197,71,.06)}
html[data-theme="dark"] .cal-wd.sun,html[data-theme="dark"] .cal-hol.full,html[data-theme="dark"] .cal-hol.partial,html[data-theme="dark"] .hol-type.full,html[data-theme="dark"] .hol-type.partial{color:#e8c547}
html[data-theme="dark"] .cal-hol.partial,html[data-theme="dark"] .hol-type.partial{background:rgba(232,197,71,.14)}
html[data-theme="dark"] .cal-legend .hol:before,html[data-theme="dark"] .cal-legend .part:before,html[data-theme="dark"] .cal-legend .off:before{background:rgba(232,197,71,.14)}

/* v0.52.0 / SCHEDULE: 日付枠のダブルクリックで予定の追加（SC4）。ダブルクリック時の文字選択を防ぐ */
.cal-cell{-webkit-user-select:none;user-select:none}

/* v0.53.0 / LIBRARY: PROJECTごとの資料ID（WSVF-0001-L001）・未登録行の非表示・資料IDの移行（DT6・F17） */
.lib-hidden-note{margin:4px 0 0;padding:3px 8px;font-size:10px;line-height:1.5;color:var(--mid);border-left:2px solid var(--border)}
.lib-legacy{color:var(--signal)}
.lm-pick{display:flex;align-items:center;gap:6px}
.lm-pick select{min-height:22px;font-size:11px}
.lm-table td:first-child{width:22px;text-align:center;vertical-align:top}
.lm-table input[type=checkbox]{width:13px;height:13px;min-height:0;margin:2px 0 0;padding:0}
.move-sum .lm-pick{flex-direction:row;font-size:10px}
.lm-card .actions{margin-top:6px}
</style>

<script>'use strict';

/* WSVF v0.53.0 (APP / UI MAP / GUIDEBOOK share one version; UI = v0.15.0 baseline). The APP never rewrites MD except adding / editing / deleting a SCHEDULE row, adding / cancelling task requests and SCHEDULE add requests (## REQUESTS: UP / DONE / DEL / SCH) and applying a LIBRARY move table (library_path / category / revision only) and a LIBRARY ID migration (id / project_id / former_id / revision only). Source files are immutable input. No network calls. */

const APP_VERSION='0.53.0', DB_NAME='wsvf-folio-v10-clean-v1', DB_VERSION=1;

/* v0.53.0 — 資料ID：<project_id>-L<3桁連番>（例 WSVF-0001-L001）。旧形式 LIB-000123 も読み込み可。former_id（移行前の旧ID）でも資料を引ける */
const LIBID_RE=/^(?:LIB-\d{6,}|WSVF-\d{4,}-L\d{3,})$/,LIBID_G=/\b(?:LIB-\d{6,}|WSVF-\d{4,}-L\d{3,})\b/g,LIBID_NEW=/^(WSVF-\d{4,})-L(\d{3,})$/;
function libFind(id){const L=state.libraries||[];id=String(id||'');return L.find(l=>l.meta.id===id)||L.find(l=>l.meta.former_id&&String(l.meta.former_id)===id)||null;}

const UUID='[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}';
const uuid4=new RegExp('^'+UUID+'$','i');
const eventFormat=new RegExp('^EVT-('+UUID+')-(\\d{6,})$','i');
const recallFormat=new RegExp('^RCL-('+UUID+')-(\\d{6,})$','i');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cmp=(a,b)=>String(a??'').localeCompare(String(b??''),'ja');
const norm=x=>String(x??'').normalize('NFKC').toLocaleLowerCase();
const cut=(s,n=140)=>String(s||'').length>n?String(s).slice(0,n)+'…':String(s||'');
function attr(x){return esc(x);}
function dequote(x){x=String(x??'').trim();if(x.startsWith('"')&&x.endsWith('"')){try{return JSON.parse(x)}catch{return x.slice(1,-1)}} if(x.startsWith("'")&&x.endsWith("'"))return x.slice(1,-1);return x;}
function stripYamlComment(v){v=String(v??'').trim();if(/^["']/.test(v)){const q=v[0];const end=v.indexOf(q,1);if(end>0)return v.slice(0,end+1);}return v.replace(/\s+#.*$/,'').trim();}
function yamlValue(v){v=stripYamlComment(v);if(/^\[.*\]$/.test(v)){return v.slice(1,-1).split(',').map(x=>dequote(x)).map(x=>String(x).trim()).filter(Boolean);}return dequote(v);}
function parseFront(text){
 const match=text.match(/^---\r?\n([\s\S]*?)\r?\n---(?:\r?\n|$)/);
 if(!match)throw Error('先頭のYAML front matterがありません');
 const meta={};let listKey=null;
 for(const line of match[1].split(/\r?\n/)){
  const item=line.match(/^\s+-\s*(.*)$/);
  if(item&&listKey){if(!Array.isArray(meta[listKey]))meta[listKey]=[];const v=yamlValue(item[1]);if(v!=='')meta[listKey].push(v);continue;}
  const m=line.match(/^([A-Za-z_][\w-]*):(?:\s*(.*))?$/);
  if(m){if(meta[m[1]]!==undefined)throw Error('front matterのキー重複: '+m[1]);const raw=stripYamlComment(m[2]||'');meta[m[1]]=raw===''?'':yamlValue(raw);listKey=raw===''?m[1]:null;continue;}
  if(line.trim())listKey=null;

}

function precheck(p,existing){let errors=[...p.errors],warnings=[...p.warnings];let old=existing.find(x=>x.key===p.key)||null;
 if(p.kind==='project'&&old&&old.id!==p.meta.project_id)return {parsed:p,name:p.name,key:p.key,hash:p.hash||sha256(p.text),old:null,action:'error',errors:['project_uid が既存の '+old.id+' と同じです。別の案件には新しいUUIDが必要です（新規PROJECT指示書から作り直してください）'],warnings};let hash=p.hash||sha256(p.text);p.hash=hash;let action='new';
 if(old){const nr=p.kind==='library'?libRev(p.meta):+p.meta.revision,or=+old.revision;
  if(old.kind!==p.kind)errors.push('既存キーの種類が異なります');
  else if(nr<or){action='skip';errors.length=0;var skipNote='保存済み rev.'+or+' の方が新しいためスキップ';}
  else if(nr===or&&hash!==old.hash)errors.push('同一revision（rev.'+or+'）で内容が異なります。revisionを+1してください');
  else if(nr===or)action='skip';
  else action='update';}
 if(p.kind==='project'&&old){const oldP=parseStored(old);if(oldP.meta?.project_id!==p.meta.project_id)errors.push('project_id変更は不可');if(oldP.meta?.last_event_seq!==undefined&&+p.meta.last_event_seq<+oldP.meta.last_event_seq)errors.push('last_event_seqの巻き戻し不可');if(oldP.meta?.last_recall_seq!==undefined&&+p.meta.last_recall_seq<+oldP.meta.last_recall_seq)errors.push('last_recall_seqの巻き戻し不可');if(oldP.meta?.last_library_seq!==undefined&&p.meta.last_library_seq!==undefined&&+p.meta.last_library_seq<+oldP.meta.last_library_seq)errors.push('last_library_seqの巻き戻し不可');}
 const fr=fileRev(p.name),nr2=revOf(p);if(fr!==null&&fr!==nr2)warnings.push(p.name+'：ファイル名の_r'+fr+'と中身のrevision '+nr2+'が一致しません（中身のrevisionで判定）');
 return {parsed:p,name:p.name,key:p.key,hash,old,action,errors:action==='skip'?[]:errors,warnings,note:typeof skipNote!=='undefined'?skipNote:''};}
function globalValidate(staged){
 const seenStaged=new Map();for(const s of staged){if(!s.key||s.action==='skip')continue;if(seenStaged.has(s.key)){s.errors.push('同一バッチ内で同一データIDが重複');seenStaged.get(s.key).errors.push('同一バッチ内で同一データIDが重複');}else seenStaged.set(s.key,s);}
 const changed=staged.filter(s=>s.parsed&&s.action!=='skip');const combined=new Map(state.docs.map(x=>[x.key,x]));for(const s of changed)combined.set(s.key,toRecord(s.parsed));
 const parsed=[...combined.values()].map(parseStored);const idMap=new Map(),uidMap=new Map(),nodeMap=new Map(),evtMap=new Map(),recMap=new Map(),libMap=new Map();
 function register(map,id,owner,msg){if(!id)return; if(map.has(id)){for(const s of staged.filter(s=>s.key===owner||s.key===map.get(id)))s.errors.push(msg+': '+id);}else map.set(id,owner);}
 for(const p of parsed){const owner=p.key;if(p.kind==='project'){register(idMap,p.meta.project_id,owner,'PROJECT表示IDが重複');register(uidMap,p.meta.project_uid,owner,'PROJECT UUIDが重複');for(const n of p.nodes){if(!n.root)register(nodeMap,n.id,owner,'内部ノードIDが重複');for(const e of n.events)register(evtMap,e.id,owner,'予定IDが重複');for(const r of n.recalls)register(recMap,r.id,owner,'RECALL IDが重複');}}
 if(p.kind==='library')register(libMap,p.meta.id,owner,'LIBRARY IDが重複');}
 // Cross-references are checked without silently fabricating absent items from the draft.
 const knownEvents=new Set(evtMap.keys()),knownLib=new Set(libMap.keys());for(const p of parsed)if(p.kind==='library'&&p.meta.former_id)knownLib.add(String(p.meta.former_id));
 for(const s of staged){const p=s.parsed;if(!p||s.action==='skip')continue;
 if(p.kind==='project')for(const n of p.nodes){for(const e of n.events){if(e.related&&!knownEvents.has(e.related)&&!String(e.related).toLowerCase().includes(String(p.meta.project_uid).toLowerCase()))s.warnings.push('参照先の関連予定が未取込: '+e.related);}
 const rows=mdTableRows(n.sections.LIBRARY||'');for(const row of rows){if(LIBID_RE.test(row[0])&&!knownLib.has(row[0]))s.warnings.push('LIBRARY資料未収録: '+row[0]);}
 }
 // Refuse accidental omission of active history records across project/notes revisions.
 if(s.old&&p.kind==='project'){
   const previous=parseStored(s.old);const oldEvents=previous.nodes.flatMap(n=>n.events.map(e=>e.id));const oldRecalls=previous.nodes.flatMap(n=>n.recalls.map(r=>r.id));
   
   for(const id of oldRecalls)if(!recMap.has(id))s.errors.push('旧版からRECALL IDが消失: '+id);
   const presentNodeIds=new Set(parsed.filter(x=>x.kind==='project').flatMap(x=>x.nodes.slice(1).map(n=>n.id)));
    for(const n of previous.nodes.slice(1))if(!presentNodeIds.has(n.id))s.errors.push('旧版から内部ノードが消失: '+n.id);
 }
 }
}
async function stageFilesCore(files,mode='auto',opts={}){
 if(!files?.length)return false;
 if(state.busy){severity('前の取込処理中です。','error');return false;}
 if(!state.storageOK){severity('保存領域が利用できないためMDを取り込めません。','error');return false;}
 state.busy=true;
 try{
  const latest=await loadDocs();state.docs=latest;derived();
  const staged=[];
  for(const f of files){const name=f.name||'';
   try{if(!/\.md$/i.test(name))throw Error('Markdown（.md）以外は取り込めません');
    const text=await f.text();
    if(isLibraryIndex(text)){staged.push({name,key:'',errors:[],warnings:['library-index.mdは廃止されました（不要のためスキップ）'],action:'skip'});continue;}
    const p=parseIncoming(text,name);staged.push(precheck(p,latest));
   }catch(e){staged.push({name,key:'',errors:[String(e.message||e)],warnings:[],action:'error'});}
  }
  const byKey=new Map();for(const s of staged){if(!s.parsed||!s.key)continue;if(!byKey.has(s.key))byKey.set(s.key,[]);byKey.get(s.key).push(s);}
  for(const arr of byKey.values()){if(arr.length<2)continue;const max=Math.max(...arr.map(s=>revOf(s.parsed)));const tops=arr.filter(s=>revOf(s.parsed)===max);
   if(new Set(tops.map(s=>s.hash)).size>1){tops.forEach(s=>s.errors.push('同じrevision（rev.'+max+'）で内容の異なるファイルが同時に渡されました'));continue;}
   const keep=tops.find(s=>s.action!=='skip')||tops[0];for(const s of arr){if(s===keep)continue;s.errors=[];s.action='skip';s.note=revOf(s.parsed)<max?'同時に渡された rev.'+max+' を採用':'同じ内容の重複';}}
  globalValidate(staged);
  const failures=staged.filter(s=>s.errors?.length);
  if(failures.length){
   const detail=failures.map(s=>`${s.name}: ${s.errors.join(' ／ ')}`).join(' ｜ ');{const fx=failures.filter(f=>f.parsed?.kind!=='toolbox'&&f.parsed?.kind!=='holidays'&&!f.errors.some(e=>/指示書・相談パック|NOTESは|LIBRARY|ツールMD/.test(e)));state.lastFix=fx.length?buildFixRequest(fx):'';}
   severity((opts.dryRun?'検証エラー（未保存）：':'取込を中止（保存データは変更なし）：')+cut(detail,700),'error');return false;
  }
  state.lastFix='';const warnText=staged.flatMap(s=>s.warnings||[]);const warnTail=warnText.length?' ／ 注意：'+cut(warnText.join(' ・ '),400):'';
  if(opts.dryRun){severity('検証に合格しました（まだ保存していません）。'+warnTail,'success');return true;}
  const applying=staged.filter(s=>s.action!=='skip');
  const skipText=staged.filter(s=>s.action==='skip'&&s.parsed).map(s=>s.name+'（rev.'+revOf(s.parsed)+'：'+(s.note||'登録済みの最新版と同一')+'）');const skipTail=skipText.length?' ／ スキップ：'+cut(skipText.join('、'),400):'';
  if(!applying.length){severity('取り込む変更はありません。APPには既に最新版があります。'+skipTail+warnTail,'success');return true;}
  // Check against the latest committed version before the transaction; commit itself checks the same heads atomically.
  const fresh=await loadDocs();
  const rechecked=applying.map(s=>precheck(s.parsed,fresh));
  const original=state.docs;state.docs=fresh;globalValidate(rechecked);state.docs=original;
  if(rechecked.some(s=>s.errors.length||s.action==='skip'))throw Error('保存直前に変更・競合がありました。再度MDをドロップしてください');
  const records=applying.map(s=>toRecord(s.parsed));
  await txCommit(records,new Map(applying.map(s=>[s.key,s.old])));
  state.docs=await loadDocs();derived();
  const selected=records.filter(r=>r.kind==='library');if(selected.length===1){state.selectedLibrary=selected[0].id;state.libFolder='';}
  severity(records.length+'件のMDを保存しました（新規 '+staged.filter(s=>s.action==='new').length+'件／更新 '+staged.filter(s=>s.action==='update').length+'件）。採用：'+cut(applying.map(s=>s.name+'（rev.'+revOf(s.parsed)+'）').join('、'),300)+(selected.length===1?' LIBRARY ID: '+selected[0].id:'')+skipTail+warnTail,'success');
  return true;
 }catch(e){severity('取込失敗（既存MDは維持）：'+String(e.message||e),'error');return false;}
 finally{state.busy=false;}
}

/* ===== v0.43.0 — password ZIP (traditional PKWARE / ZipCrypto), LIBRARY sort, scroll keep ===== */
function zcKeys(pw){const k=[0x12345678,0x23456789,0x34567890];const up=b=>{k[0]=(CRC_TABLE[(k[0]^b)&255]^(k[0]>>>8))>>>0;k[1]=(Math.imul((k[1]+(k[0]&255))>>>0,134775813)+1)>>>0;k[2]=(CRC_TABLE[(k[2]^(k[1]>>>24))&255]^(k[2]>>>8))>>>0;};for(const b of new TextEncoder().encode(pw))up(b);return {k,up};}

const AI_GUIDE_VERSION='0.53';
const AI_GUIDE_BLOCK="## AI GUIDE｜AI向け運用ルール（このMDを受け取ったAIは最初に読むこと・この節は変更禁止）\n- wsvf-ai-guide: 0.53\n- このファイルはWSVF（案件記録システム）のPROJECT MDです。1つの案件群の記録（現在の状況・予定・決定・経緯・知見）がすべてこの1ファイルに入っています。\n- 相談を受けたら、このファイルの内容（特にCURRENT・DECISIONS・HISTORY・RECALL）を過去の経緯として踏まえて回答してください。\n- ファイルに書かれていないことは推測で補わず「記録なし」「要確認」と伝えてください。日付・数値・ID・固有名詞を作り話にしないでください。\n\n### 書き出し（ユーザーが「MDを書き出して」「再出力して」などと指示した時だけ行う）\n1. このファイルの全文を省略せず、1つのコードブロック（````markdown で始め ```` で閉じる）で出力する。「以下同じ」「省略」などは禁止。\n2. 内容を変えた場合だけ、front matter の revision を +1 し、updated_at を現在日時（例 2026-10-14T09:00:00+09:00）にする。ファイル名は <project_id>_r<revision>.md と案内する。\n3. この「AI GUIDE」節は一字も変えずに残す（APPの依頼文で新しい版のAI GUIDEが渡された時だけ、その内容に丸ごと置き換える）。見出し・表の列・キー名は変えない。\n4. 既存の記録（SUBPROJECT・RECALL・HISTORY）は削除しない。予定は不要になれば行ごと削除してよい（そのIDは再利用せず、last_event_seq も戻さない）。中止・延期の経緯を残したい場合は行を残して状態を変える。\n5. project_id・project_uid・node_id・既存の各IDは変更しない（APPの依頼文で資料IDの置き換えを指示された時を除く）。新しいUUIDを作らない。\n\n### 構造\n- 「## GROUP」（MAINPROJECT）は分類と範囲だけを書く。実務の記録は「## SUBPROJECTS」の下の各SUBPROJECTに書く。SUBPROJECTの下にSUBPROJECTは作らない。\n- SUBPROJECTは必ず9節を持つ：CURRENT / NEXT / SCHEDULE / DECISIONS / OPEN / HISTORY / LIBRARY / RECALL / AI REVIEW。書くことがなければ「- なし」。\n- SUBPROJECTを追加する時：node_id は <project_id>-S<2桁連番>（既存の最大+1）、parent_node_id はこのファイルの project_id、status は active、9節をすべて作る。GROUPのSUBPROJECT一覧にも追記する。\n\n### ID\n- 予定ID：EVT-<project_uid>-<6桁連番>。新しい予定には front matter の last_event_seq に1を足した番号を使い、last_event_seq も同じ値に更新する。\n- RECALL ID：RCL-<project_uid>-<6桁連番>。last_recall_seq に1を足した番号を使い、last_recall_seq も更新する。\n- 資料ID：<project_id>-L<3桁連番>（例 WSVF-0001-L001）。ユーザーに資料の登録を頼まれた時だけ採番する：front matter の last_library_seq に1を足した番号を使い、last_library_seq も更新する（キーがなければ 0 として last_recall_seq の次の行に追加）。資料ごとにLIBRARY ITEM MD（front matter に type: library_item・id・project_id・title・category・library_path など）を作り、関係するSUBPROJECTのLIBRARY表に1行追加する。他のPROJECTの資料番号は気にしなくてよい。旧形式の資料ID（LIB-000123）は、APPの依頼文で新しいIDへの置き換えを指示された時だけ置き換える。\n- 連番は戻さない。他の案件から移ってきたSUBPROJECTのIDは、先頭のUUIDが違っていてもそのまま残す。\n\n### 各節の書き方\n- CURRENT：目的・最新状況・現在の焦点。DECISIONS：決定事項とその理由。\n- NEXT（次の行動）：必ず行う必要がある作業だけを書く（ユーザーのタスク一覧になる）。1項目1作業で「〜する」の形にする。必要か迷うもの・都度対応でよいもの・確認待ちはNEXTに書かずOPENに書く。OPENからNEXTへ移すのは、ユーザーが指示した時（APPの昇格申請を含む）か、必ず行う必要が明確になった時だけ。\n- OPEN（参考・気づき）：未解決の問い・確認待ち・検討するとよいこと・AIからの気づきや提案を書く。ユーザーの判断材料なので消さずに残す。答えが出たものはDECISIONSに記録してから、不要と確認されたものはHISTORYに記録してから削除する。NEXTと同じ内容を重ねて書かない。見出しは「#### OPEN｜参考・気づき」。\n- MDの末尾に「## REQUESTS」節がある時は、書き出し時にその節の手順に従って処理する。\n- HISTORY：「##### YYYY-MM-DD」の見出しの下に、起きたことと判断の理由を追記する（古い記録は消さない）。\n- SCHEDULE：表 | event_id | 開始 | 終了 | 内容 | 状態 | related_event_id | 備考・根拠 |。日時は YYYY-MM-DD または YYYY-MM-DD HH:mm、空欄は「—」。状態は 予定・実施・延期・中止・希望・要確認 のいずれか。日付を過ぎても勝手に「実施」にしない。延期の時は元の行を「延期」にし、新しいIDの行を追加して related_event_id に元のIDを書く。\n- LIBRARY：表 | 資料ID | 資料名 | 関係・参照先 | 状態 |。表に書くのはWSVFに登録済みの資料（資料IDがあるもの）だけ。状態は registered。会話や添付に出てきただけの資料・未登録の資料を自動で表に加えない（資料IDが「—」の行や pending の行を作らない）。資料の登録はユーザーが都度指示する。\n- RECALL：後で探したい判断・経験をカードで追加する。見出しは「##### RECALL <RCL-ID>｜<短い見出し>」、項目は recall_id / scope_id（そのSUBPROJECTのnode_id）/ type（DECISION・FINDING・EXPERIENCE・LESSON・METHOD・REFERENCE）/ status（current・superseded・withdrawn）/ when / question / summary / reason / keywords / source_locator / library_ids。\n- AI REVIEW：ユーザーにレビューを頼まれた時だけ更新する（reviewed_at・status: reviewed・assessment・risks_and_gaps・suggestions・source_locators）。提案を勝手にDECISIONSへ移さない。\n\n### 状態の変更\n- PROJECTの status は active（稼働中）か completed（完了）だけ。SUBPROJECTの status も同じ。\n- 状態を変える時は理由を確認し、GROUPに「- 状態変更：YYYY-MM-DD 旧状態→新状態（理由）」を1行追記し、関係するSUBPROJECTのHISTORYにも記録する。\n";

 if(!rows.length)throw Error('移動表に資料の行がありません（| 資料ID | 資料名 | 現在のlibrary_path | 新しいlibrary_path | 理由 | の表が必要）');return {name,meta,rows};}

function reqBounds(lines){const L=i=>lines[i].replace(/\r$/,'');let s=-1;for(let i=0;i<lines.length;i++)if(/^## REQUESTS｜/.test(L(i))){s=i;break;}if(s<0)return null;let e=lines.length;for(let i=s+1;i<lines.length;i++)if(/^#{1,2} /.test(L(i))){e=i;break;}return [s,e];}
function addRequestRow(text,row){const nl=text.includes('\r\n')?'\r\n':'\n';const lines=text.split('\n');const b=reqBounds(lines);
 if(!b){let t=text.replace(/\s*$/,'');return t+nl+nl+REQ_HEAD+nl+REQ_GUIDE+nl+nl+REQ_TH.split('\n').join(nl)+nl+row+nl;}
 const cr=nl==='\r\n'?'\r':'';lines[b[0]]=REQ_HEAD+cr;for(let i=b[0]+1;i<b[1];i++){if(/^- このMDを受け取ったAIへ：/.test(lines[i]))lines[i]=REQ_GUIDE+cr;else if(/^\|\s*request_id\s*\|/.test(lines[i]))lines[i]=REQ_TH.split('\n')[0]+cr;}
 let last=-1;for(let i=b[0]+1;i<b[1];i++)if(/^\s*\|/.test(lines[i]))last=i;
 if(last<0){lines.splice(b[1],0,...(REQ_TH+'\n'+row).split('\n').map(x=>x+(nl==='\r\n'?'\r':'')),'');return lines.join('\n');}
 lines.splice(last+1,0,row+(nl==='\r\n'?'\r':''));return lines.join('\n');}
function removeRequestRow(text,id){let lines=text.split('\n');const b=reqBounds(lines);if(!b)throw Error('REQUESTS節が見つかりません');const re=new RegExp('^\\s*\\|\\s*'+id+'\\s*\\|');const hit=[];for(let i=b[0];i<b[1];i++)if(re.test(lines[i]))hit.push(i);if(hit.length!==1)throw Error('申請 '+id+' の行が'+(hit.length?'複数':'見つかりません'));
 lines.splice(hit[0],1);const b2=reqBounds(lines);const left=lines.slice(b2[0],b2[1]).filter(l=>/^\s*\|\s*(?:DEL|DONE|UP|SCH)-\d+\s*\|/.test(l)).length;
 if(!left){let s=b2[0];while(s>0&&!lines[s-1].trim())s--;lines.splice(s,b2[1]-s);let t=lines.join('\n').replace(/\s*$/,'');return t+(text.includes('\r\n')?'\r\n':'\n');}
 return lines.join('\n');}

 severity(`予定「${cut(f.title,40)}」の追加を申請しました（${p.meta.project_id} rev.${out.rev}・${id}）。MDを書き出してAIに渡すと、予定・実績に登録されます。`,'success',{sync:note});}
/* ===== v0.53.0 — PROJECTごとの資料ID・関連資料の整理・資料IDの移行 ===== */
function libSeqOf(p){const pid=p.meta.project_id;let max=/^\d+$/.test(String(p.meta.last_library_seq||''))?+p.meta.last_library_seq:0;for(const l of state.libraries){const m=String(l.meta.id).match(LIBID_NEW);if(m&&m[1]===pid)max=Math.max(max,+m[2]);}for(const m of String(p.text).matchAll(new RegExp('\\b'+pid+'-L(\\d{3,})\\b','g')))max=Math.max(max,+m[1]);return max;}
function nextLibraryId(p){if(!p)return '（PROJECTを選ぶと表示）';return p.meta.project_id+'-L'+String(libSeqOf(p)+1).padStart(3,'0');}
function libRowIsData(c){return c!=='資料ID'&&!/^:?-{2,}:?$/.test(c);}
function libSectionHtml(t){const lines=String(t||'').split('\n');let hidden=0,kept=0;const out=[];
 for(const l of lines){if(/^\s*\|/.test(l)){const c=l.trim().replace(/^\|/,'').split('|')[0].trim();if(libRowIsData(c)){if(!LIBID_RE.test(c)){hidden++;continue;}kept++;}}out.push(l);}
 let text=out.join('\n');if(hidden&&!kept)text=out.filter(l=>!/^\s*\|/.test(l)).join('\n').trim()||'- なし';
 return renderMarkdown(text)+(hidden?`<div class="lib-hidden-note">未登録の資料 ${hidden}件は表示していません（LIBRARY表には登録済みの資料だけを載せます。次のMD書き出しでAIが表から削除します）</div>`:'');}
function libCleanupInfo(p){const map=[],seen=new Set();for(const m of String(p.text).matchAll(LIBID_G)){const id=m[0];if(seen.has(id)||!/^LIB-/.test(id))continue;seen.add(id);const l=state.libraries.find(x=>String(x.meta.former_id||'')===id);if(l)map.push({from:id,to:l.meta.id,title:l.meta.title});}
 let pend=0;for(const n of p.nodes.slice(1))for(const r of mdTableRows(n.sections.LIBRARY||'')){const c=String(r[0]||'').trim();if(libRowIsData(c)&&!LIBID_RE.test(c))pend++;}
 const seq=libSeqOf(p),cur=p.meta.last_library_seq,needSeq=cur===undefined||cur===null||cur===''||+cur!==seq;return {map,pend,seq,needSeq};}
function libCleanupText(p){const x=libCleanupInfo(p),out=[];let i=1;
 if(x.map.length)out.push(`${i++}. **資料IDの置き換え**（APPで移行済み）：MD全体（LIBRARY表・本文・RECALLの library_ids など）で、次の旧IDをすべて新IDに置き換える。資料名・関係・状態の欄は変えない。\n\n| 旧ID | 新ID | 資料名 |\n| --- | --- | --- |\n${x.map.map(r=>`| ${r.from} | ${r.to} | ${String(r.title||'').replace(/\|/g,'／')} |`).join('\n')}`);
 if(x.pend)out.push(`${i++}. **未登録資料の行の削除**：各SUBPROJECTのLIBRARY表で、資料IDが登録済みの形式（${p.meta.project_id}-L001 または LIB-000123）でない行（「—」・pending など ${x.pend}件）を削除する。表に行が残らなければ「- なし」にする。削除した資料のことを本文やOPENに書き足さない。`);
 if(x.needSeq)out.push(`${i++}. **資料の採番カウンター**：front matter の last_library_seq を ${x.seq} にする（キーがなければ last_recall_seq の次の行に追加する）。`);
 return out.length?out.join('\n\n'):'整理が必要な点はありません（このまま書き出してください）。';}
function libExportSection(p){const x=libCleanupInfo(p);if(!x.map.length&&!x.pend&&!x.needSeq)return '';return `## 関連資料（LIBRARY）の整理\n書き出し時に、次の整理もあわせて行ってください（APP v${APP_VERSION}・資料IDはPROJECTごとの番号）。\n\n${libCleanupText(p)}\n\n`;}
function libLegacy(){return state.libraries.filter(l=>/^LIB-\d{6,}$/.test(l.meta.id)).sort((a,b)=>cmp(a.meta.id,b.meta.id));}
function libRefProjects(id){const re=new RegExp('\\b'+id+'\\b');return state.projects.filter(p=>re.test(p.text)).map(p=>p.meta.project_id);}
function libMigCardHtml(){const lg=libLegacy();return `<section class="surface lm-card" id="libMigCard"><div class="eyebrow">04 / LIBRARY ID</div><h2>資料IDの移行</h2><p>資料IDはv0.53.0から各PROJECTの番号（<span class="mono">WSVF-0001-L001</span>）です。旧形式（LIB-000123）の資料 <b>${lg.length}</b>件を、PROJECTごとに新しい番号へ移行します。PROJECTに属さない資料は、削除するか、新しいPROJECTを立ち上げてから移行してください。</p><div class="actions"><button type="button" class="quiet-btn" data-lm-open="" ${lg.length&&state.storageOK&&state.projects.length?'':'disabled'}>資料IDの移行…</button></div></section>`;}
function lmPreselect(){const m=state.libMig;m.sel=new Set(libLegacy().filter(l=>!l.raw&&libRefProjects(l.meta.id).includes(m.pid)).map(l=>l.meta.id));}
function lmOpen(pid){const p=state.projects.find(x=>x.meta.project_id===pid)||state.projects.find(x=>x.meta.status!=='completed')||state.projects[0];state.libMig={pid:p?p.meta.project_id:'',sel:new Set()};lmPreselect();state.drawer='';render();}
function lmPlan(){const m=state.libMig;const p=state.projects.find(x=>x.meta.project_id===m.pid);if(!p)return {p:null,rows:[]};let seq=libSeqOf(p);
 const rows=libLegacy().map(l=>{const r={l,refs:libRefProjects(l.meta.id),on:m.sel.has(l.meta.id),err:l.raw?'旧APP登録（front matterなし）の資料は移行できません。LIBRARY ITEM形式のMDを作り直してください':''};if(r.on&&!r.err)r.to=p.meta.project_id+'-L'+String(++seq).padStart(3,'0');return r;});return {p,rows};}
function lmHtml(){const m=state.libMig;if(!m)return '';const {p,rows}=lmPlan();const n=rows.filter(r=>r.to).length;
 return `<div class="drawer-mask" data-lm-close></div><aside class="lib-drawer move-drawer lm-drawer" role="dialog" aria-label="資料IDの移行"><div class="drawer-head"><div><div class="eyebrow en">LIBRARY ID / MIGRATION</div><h2>資料IDの移行（PROJECTごとの番号へ）</h2></div><button type="button" class="drawer-x" data-lm-close aria-label="閉じる">×</button></div>
 <div class="move-sum"><label class="lm-pick">移行先PROJECT <select id="lmPid">${state.projects.map(x=>`<option value="${attr(x.meta.project_id)}" ${x.meta.project_id===m.pid?'selected':''}>${esc(x.meta.project_id)} / ${esc(x.meta.title)}</option>`).join('')}</select></label><span>旧ID <b>${rows.length}</b></span><span>MIGRATE <b>${n}</b></span>${p?`<span>NEXT <b>${esc(nextLibraryId(p))}</b></span>`:''}</div>
 <p class="move-note">チェックした資料を、選んだPROJECTの資料として新しい番号（<code>${esc(m.pid)}-L001</code> 形式）に移します。APPが資料MDの <code>id</code> を書き換え、<code>project_id</code> と <code>former_id</code>（旧ID）を加えて <code>revision</code> を+1します（本文・その他の項目は変えません）。旧IDでの登録は外します。PROJECT MDの中の旧IDは、APPの表示では新しい資料に結びつき、適用後に自動で書き出す<b>書き出し依頼MD</b>でAIに置き換えを依頼します。初期状態では、このPROJECTが参照している資料にチェックが入っています。</p>
 <div class="drawer-body"><div class="table-scroll"><table class="md-table move-table lm-table"><tr><th></th><th>旧ID</th><th>資料名</th><th>参照しているPROJECT</th><th>新ID</th></tr>${rows.length?rows.map(r=>`<tr class="move-row ${r.err?'error':r.on?'apply':'same'}"><td><input type="checkbox" data-lm-id="${attr(r.l.meta.id)}" ${r.on?'checked':''} ${r.err?'disabled':''}/></td><td class="mono">${esc(r.l.meta.id)}</td><td>${esc(r.l.meta.title)}<div class="tiny muted">${esc(libPath(r.l.meta))}</div>${r.err?`<span class="move-msg">${esc(r.err)}</span>`:''}${r.on&&r.refs.some(x=>x!==m.pid)?`<span class="move-msg warn">ほかのPROJECTからも参照されています（参照はそのまま残り、表示では新しい資料に結びつきます）</span>`:''}</td><td class="mono tiny">${r.refs.length?r.refs.map(esc).join('<br>'):'<span class="muted">なし</span>'}</td><td class="mono"><b>${r.to?esc(r.to):'—'}</b></td></tr>`).join(''):`<tr><td colspan="5" class="muted">旧形式（LIB-）の資料はありません。</td></tr>`}</table></div></div>
 <div class="drawer-foot"><button type="button" class="primary-btn" data-lm-apply ${n&&state.storageOK?'':'disabled'}>${n}件を ${esc(m.pid)} の資料として移行</button><button type="button" class="quiet-btn" data-lm-close>移行しないで閉じる</button></div></aside>`;}
function rewriteLibId(text,newId,pid,oldId,rev){const m=text.match(/^---(\r?\n)([\s\S]*?)\r?\n---/);if(!m)throw Error('front matterがありません');const nl=m[1];const lines=m[2].split(/\r?\n/);
 const idx=k=>lines.findIndex(l=>new RegExp('^'+k+':').test(l));const i=idx('id');if(i<0)throw Error('idの行がありません');lines[i]='id: '+newId;
 for(const [k,v] of [['former_id',oldId],['project_id',pid]]){const j=idx(k);if(j>=0)lines[j]=k+': '+v;else lines.splice(i+1,0,k+': '+v);}
 const r=idx('revision');if(r>=0)lines[r]='revision: '+rev;else lines.push('revision: '+rev);
 return '---'+nl+lines.join(nl)+nl+'---'+text.slice(m[0].length);}
async function lmApply(){const m=state.libMig;if(!m)return;const {p,rows}=lmPlan();const items=rows.filter(r=>r.to);if(!p||!items.length)return;
 if(!confirm(`${items.length}件の資料を ${p.meta.project_id} の資料として新しい番号に移行します。\n資料MDの id を書き換え、project_id・former_id を加えて revision を+1します（本文は変えません）。\nよろしいですか？`))return;
 const files=[];try{for(const r of items){const rec=state.docs.find(x=>x.key==='l:'+r.l.meta.id);if(!rec)throw Error(r.l.meta.id+' の原本が見つかりません');const rev=libRev(r.l.meta)+1;const text=rewriteLibId(rec.text,r.to,p.meta.project_id,r.l.meta.id,rev);const pl=parseLibrary(text,rec.name);if(pl.errors.length)throw Error(r.l.meta.id+'：'+pl.errors.join(' ／ '));files.push({name:(stemOf(rec.name)||r.to)+'_r'+rev+'.md',text:async()=>text});}}catch(e){severity('移行できません：'+String(e.message||e),'error');return;}
 const ok=await stageFilesCore(files);if(!ok)return;
 try{for(const r of items)await txDelete('l:'+r.l.meta.id);}catch(e){state.docs=await loadDocs();derived();severity('新しい番号の資料は保存しましたが、旧IDの登録を外せませんでした：'+String(e.message||e)+'。DATA画面で旧IDの資料を削除してください。','error');return;}
 state.docs=await loadDocs();derived();state.libMig=null;state.selectedLibrary='';
 const np=state.projects.find(x=>x.meta.project_id===p.meta.project_id)||p;writeRequestMD(np);
 severity(`${items.length}件の資料を ${p.meta.project_id} の資料に移行しました（${items.map(r=>r.l.meta.id+' → '+r.to).join('、')}）。${p.meta.project_id} の書き出し依頼MD（資料IDの置き換えの依頼つき）を書き出しました。AIに渡し、出力された最新版MDを取り込んでください。元のMDファイルは変わらないため、「全MDとAPP一式をZIPで書き出す」で保管してください。`,'success');}
async function lmClick(b){const d=b.dataset;
 if(d.lmOpen!==undefined){lmOpen(d.lmOpen);return true;}
 if(d.lmClose!==undefined){state.libMig=null;render();return true;}
 if(d.lmApply!==undefined){await lmApply();return true;}
 return false;}
document.addEventListener('change',e=>{const t=e.target;if(!state.libMig||!t)return;if(t.id==='lmPid'){state.libMig.pid=t.value;lmPreselect();render();}else if(t.dataset&&t.dataset.lmId){const s=state.libMig.sel;t.checked?s.add(t.dataset.lmId):s.delete(t.dataset.lmId);render();}});
document.addEventListener('click',e=>{if(state.libMig&&e.target.matches&&e.target.matches('.drawer-mask[data-lm-close]')){state.libMig=null;render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.libMig){state.libMig=null;render();}});
async function schClick(b){const d=b.dataset;
 if(d.schAdd!==undefined){schOpen(d.schAdd);return true;}
 if(d.schClose!==undefined){state.schForm=null;render();return true;}
 if(d.schSave!==undefined){await schSave();return true;}
 if(d.schCancel){const [pid,id]=d.schCancel.split('|');await taskReqCancel(pid+'|'+id);return true;}
 if(d.schFocus){state.schFocus=state.schFocus===d.schFocus?'':d.schFocus;render();requestAnimationFrame(()=>{const el=document.querySelector(`[data-sch-row="${CSS.escape(d.schFocus)}"]`)||$('schPending');if(el&&state.schFocus){const top=el.getBoundingClientRect().top+scrollY-(document.querySelector('.sticky-chrome')?.offsetHeight||0)-60;window.scrollTo({top:Math.max(0,top),behavior:'smooth'});}});return true;}
 return false;}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.schForm){state.schForm=null;render();}});
/* v0.52.0 — 日付枠（SC0-c・3Mの日付）をダブルクリックすると、その日付を開始日にして予定の追加（SC4）を開く。予定チップ・申請チップ・「+n件」は対象外 */
document.addEventListener('dblclick',e=>{if(state.view!=='schedule'||!state.storageOK||state.schForm)return;const t=e.target;if(!t.closest)return;
 if(t.closest('.cal-ev,.cal-more'))return;const c=t.closest('.cal-cell');if(!c)return;

 e.preventDefault();window.getSelection?.()?.removeAllRanges();schOpen(day);});

document.addEventListener('click',e=>{if(state.schForm&&e.target.matches&&e.target.matches('.drawer-mask[data-sch-close]')){state.schForm=null;render();}});

 if(await schClick(b))return true;
 if(await lmClick(b))return true;
 if(d.calDay||d.calNav!==undefined||d.calMode){state.calFocus='';return false;}
 if(d.calJump){const [date,eid]=d.calJump.split('|');calJump(date,eid);return true;}
 const open=(ctx,kind)=>{state.taskReq={ctx,kind,reason:'',resolve:[]};render();setTimeout(()=>$('tk-reason')?.focus(),0);return true;};
 if(d.taskReq)return open(d.taskReq,'del');
 if(d.taskDone)return open(d.taskDone,'done');
 if(d.taskUp)return open(d.taskUp,'up');
 if(d.taskFill&&state.taskReq){const cur=$('tk-reason')?.value.trim()||'';state.taskReq.reason=cur?cur+'。'+d.taskFill:d.taskFill;render();return true;}
 if(d.taskRefToggle!==undefined){const t=taskState();t.refOpen=!t.refOpen;taskSave();render();return true;}
 if(d.taskMd){const p=state.projects.find(x=>x.meta.project_id===d.taskMd);if(p)writeRequestMD(p,{task:true});return true;}
 if(d.taskTool){tbState().sel=d.taskTool;tbState().q='';tbSave();setView('toolbox');return true;}
 if(d.taskClose!==undefined){state.taskReq=null;render();return true;}
 if(d.taskSave!==undefined){await taskReqSave();return true;}
 if(d.taskCancel){await taskReqCancel(d.taskCancel);return true;}
 if(d.taskReset!==undefined){Object.assign(taskState(),{project:'all',req:'all',pst:'active',q:''});taskSave();render();return true;}
 if(d.projectOpen){state.selectedProject=d.projectOpen;state.selectedNode=d.projectOpen;state.section='ALL';setView('projects');return true;}
 return false;}
